<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบทดสอบกระโดดสูง</title><style>html,body{margin:0;height:100%;background:#f5f8ff}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="quiz" src="field-events-quiz.html" title="แบบทดสอบกระโดดสูง"></iframe><script>const TARGET='กระโดดสูง';document.getElementById('quiz').addEventListener('load',()=>{try{const d=document.getElementById('quiz').contentDocument;const btn=[...d.querySelectorAll('button')].find(b=>b.textContent.trim()===TARGET);if(btn)btn.click();}catch(e){console.error(e);}});</script></body></html>
