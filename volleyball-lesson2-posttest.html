19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option><option>32</option><option>33</option><option>34</option><option>35</option><option>36</option><option>37</option><option>38</option><option>39</option><option>40</option><option>41</option><option>42</option><option>43</option><option>44</option><option>45</option><option>46</option><option>47</option><option>48</option><option>49</option><option>50</option></select><label>เลขประจำตัวนักเรียน<input id="studentId" type="text" inputmode="numeric" pattern="[0-9]+" autocomplete="off" required placeholder="กรอกเลขประจำตัวนักเรียน"></label></div></div><p>เลือกคำตอบที่ถูกที่สุด 10 ข้อ แบบทดสอบนี้ไม่แสดงเฉลย</p></section><div id="quiz"></div><div style="text-align:center;margin:25px"><button id="sendPostBtn" onclick="submitQuiz()">📤 ส่งแบบทดสอบ</button></div><section id="result" class="card result"><h2 id="postResultTitle">ผลการส่งแบบทดสอบ</h2><div id="score" style="font-size:38px;font-weight:900;color:#0757a6"></div><p id="postSendStatus" aria-live="polite"></p></section></div><script>const URL='https://script.google.com/macros/s/AKfycbyVpEdhavIE0Q8ccAWax7pF8ql6JAZ7IOBVBPplAW18x5QfpZZ8lZTy3CLCP6T0yt5b0g/exec';const qs=[["การเซตบอลคืออะไร",["การใช้มือและนิ้วควบคุมบอลเหนือศีรษะเพื่อส่งไปยังเป้าหมาย","ใช้เท้าเตะบอล","จับบอลไว้แล้วโยน","ใช้แขนท่อนล่างตีทุกครั้ง"],0],["ก่อนเซตควรจัดมืออย่างไร",["กำมือ","เตรียมมือและนิ้วเหนือบริเวณหน้าผาก","วางมือด้านหลัง","วางแขนลง"],1],["เมื่อต้องเซตบอลด้านข้างควรทำอย่างไร",["ยืนอยู่กับที่","หลับตา","เคลื่อนที่เข้าหาบอลและจัดตำแหน่ง","กระโดดทันที"],2],["จุดสัมผัสบอลที่เหมาะสมคืออะไร",["ข้อศอก","ฝ่ามือเต็ม ๆ","นิ้วมือ","ต้นแขน"],2],["อะไรช่วยให้เซตแม่นยำขึ้น",["ควบคุมแรงและทิศทางสัมพันธ์กับเป้าหมาย","ใช้แรงมากที่สุด","มองพื้น","ไม่ขยับเท้า"],0],["การเซตให้เพื่อนควรคำนึงถึงอะไร",["ตำแหน่งและจังหวะของเพื่อน","จำนวนผู้ชม","สีลูกบอล","เสียงนกหวีดเท่านั้น"],0],["ถ้าบอลลอยห่างควรทำอย่างไร",["เอื้อมอย่างเดียว","เคลื่อนที่ไปอยู่ในตำแหน่งเหมาะสม","ปล่อยตก","หันหลัง"],1],["ข้อใดเป็นข้อผิดพลาด",["เคลื่อนที่เข้าหาบอล","ควบคุมทิศทาง","วางมือและนิ้วไม่ถูกตำแหน่ง","มองบอล"],2],["การฝึกเป็นคู่ช่วยพัฒนาทักษะได้อย่างไร",["ให้ข้อมูลสะท้อนกลับ","บอกว่าเก่งอย่างเดียว","ไม่สังเกต","เปลี่ยนกิจกรรมทุกครั้ง"],0],["การนำทักษะไปใช้จริงที่เหมาะสมคืออะไร",["เซตให้เพื่อนในตำแหน่งที่พร้อมเล่นต่อ","จับบอลไว้","เตะบอล","ยืนอยู่นอกสนาม"],0]];const quiz=document.getElementById('quiz');qs.forEach((q,i)=>{const c=document.createElement('section');c.className='card';c.innerHTML='<span class="title">ข้อ '+(i+1)+'</span><h2>'+q[0]+'</h2>'+q[1].map((o,j)=>'<label class="option"><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>').join('');quiz.appendChild(c)});
function readSubmissionReceipt(endpoint,token,callbackPrefix,param) {
 return new Promise(resolve=>{
  const callback=callbackPrefix+token,tag=document.createElement('script');
  let ended=false;
  const finish=result=>{if(ended)return;ended=true;clearTimeout(timer);delete window[callback];tag.remove();resolve(result);};
  const timer=setTimeout(()=>finish(null),6000);
  window[callback]=finish;tag.onerror=()=>finish(null);
  tag.src=endpoint+'?'+param+'='+encodeURIComponent(token)+'&check='+Date.now();
  document.head.appendChild(tag);
 });
}
async function sendWithReceipt(endpoint,payload,key,callbackPrefix,param) {
 const storage='vb_lesson2_pending:'+key;
 let pending;
 try {pending=JSON.parse(sessionStorage.getItem(storage)||'null');}catch(e){}
 if(!pending || !/^[a-f0-9]{32}$/.test(pending.token)){
  const token=Array.from(crypto.getRandomValues(new Uint8Array(16)),n=>n.toString(16).padStart(2,'0')).join('');
  pending={token,payload:{...payload,receiptToken:token}};
  sessionStorage.setItem(storage,JSON.stringify(pending));
 }
 try {await fetch(endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(pending.payload)});}catch(e){}
 let result=null;
 for(let check=0;check<4&&!result;check++){
  result=await readSubmissionReceipt(endpoint,pending.token,callbackPrefix,param);
  if(!result&&check<3)await new Promise(resolve=>setTimeout(resolve,900));
 }
 if(result)sessionStorage.removeItem(storage);
 return result;
}

async function submitQuiz(){
 const name=document.getElementById('name').value.trim(),cls=document.getElementById('class').value,no=document.getElementById('no').value;
 const studentId=document.getElementById('studentId').value.trim();
 if(!/^\d+$/.test(studentId)){alert('กรุณากรอกเลขประจำตัวนักเรียน');return;}
 if(!name||!cls||!no){alert('กรุณากรอกข้อมูลให้ครบครับ');return;}
 const p={name,class:cls,no,studentId,work:'แบบทดสอบหลังเรียน เรื่องที่ 2 การเซตบอล',submissionType:'quiz',quizType:'posttest'};
 for(let i=0;i<10;i++){
  const s=document.querySelector('input[name="q'+i+'"]:checked');
  if(!s){alert('กรุณาตอบให้ครบ 10 ข้อครับ');return;}p['q'+(i+1)]=Number(s.value);
 }
 const btn=document.getElementById('sendPostBtn'),result=document.getElementById('result'),status=document.getElementById('postSendStatus');
 btn.disabled=true;btn.textContent='กำลังส่งและยืนยัน...';result.style.display='block';
 status.textContent='กำลังรอยืนยันการบันทึก กรุณารอสักครู่';
 try{
  const response=await sendWithReceipt(URL,p,'posttest:'+cls+':'+studentId,'vbQuizReceipt_','quizReceipt');
  if(!response){status.textContent='ยังไม่ได้รับผลยืนยัน กดส่งอีกครั้งเพื่อตรวจคำขอเดิม ระบบป้องกันการบันทึกซ้ำ';return;}
  if(!response.success){status.textContent=response.message||'ระบบยังไม่รับข้อสอบ กรุณาตรวจข้อมูลนักเรียน';return;}
  document.getElementById('postResultTitle').textContent=response.alreadySubmitted?'พบผลแบบทดสอบเดิมแล้ว':'บันทึกแบบทดสอบสำเร็จ';
  document.getElementById('score').textContent=typeof response.score==='number'?response.score+' / 10':'';
  status.textContent='ระบบติดตามและหน้าตรวจคะแนนนักเรียนจะอัปเดตประมาณทุก 5 นาที';
  document.querySelectorAll('input,select,button').forEach(x=>x.disabled=true);
  btn.dataset.confirmed='1';btn.textContent='บันทึกแล้ว';result.scrollIntoView({behavior:'smooth'});
 }catch(e){status.textContent='ยังยืนยันไม่ได้ กรุณาตรวจอินเทอร์เน็ตแล้วกดส่งเพื่อตรวจคำขอเดิม';}
 finally{if(btn.dataset.confirmed!=='1'){btn.disabled=false;btn.textContent='📤 ส่ง / ตรวจสถานะคำขอเดิม';}}
}
</script></body></html>
