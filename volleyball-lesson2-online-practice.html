<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบฝึกออนไลน์ เรื่องที่ 2 การเซตบอล</title><style>body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef7ff;color:#102a43;line-height:1.7}.wrap{max-width:1000px;margin:auto;padding:28px 16px}.card{background:#fff;border-radius:20px;padding:25px;margin-bottom:18px;box-shadow:0 8px 24px #0b3b6618}.title{display:inline-block;background:#0757a6;color:#fff;padding:6px 14px;border-radius:999px;font-weight:bold}.student{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin-top:15px}label{font-weight:bold;color:#0757a6}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:2px solid #d8e7f5;border-radius:12px;font-size:16px;margin-top:6px}textarea{min-height:100px}.q{margin:18px 0}.actions{text-align:center}button{border:0;border-radius:14px;padding:14px 25px;background:#0757a6;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}.result{display:none;background:#ecfff4}.back{display:inline-block;margin-top:12px;color:#0757a6;font-weight:bold}@media(max-width:650px){.student{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="card"><h1>📝 แบบฝึกออนไลน์ เรื่องที่ 2</h1><h2>การเซตบอลในกีฬาวอลเลย์บอล</h2><p>ตอบคำถามจากใบความรู้และประสบการณ์จากการฝึกจริง</p><div class="student"><div><label>ชื่อ-นามสกุล</label><input id="name"></div><div><label>ชั้น</label><select id="class"><option value="">เลือกห้อง</option><option>ม.3/1</option><option>ม.3/2</option><option>ม.3/3</option><option>ม.3/4</option><option>ม.3/5</option><option>ม.3/6</option></select></div><div><label>เลขที่</label><select id="no"><option value="">เลือกเลขที่</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option><option>32</option><option>33</option><option>34</option><option>35</option><option>36</option><option>37</option><option>38</option><option>39</option><option>40</option><option>41</option><option>42</option><option>43</option><option>44</option><option>45</option><option>46</option><option>47</option><option>48</option><option>49</option><option>50</option></select></div></div></section><section class="card"><span class="title">แบบฝึก 10 ข้อ</span><div class="q"><label>1. การเซตบอลคืออะไร</label><textarea id="q1" placeholder="เขียนคำตอบของนักเรียน"></textarea></div><div class="q"><label>2. การเซตบอลมีความสำคัญต่อการเล่นเป็นทีมอย่างไร</label><textarea id="q2" placeholder="เขียนคำตอบของนักเรียน"></textarea></div><div class="q"><label>3. ท่าเตรียมก่อนเซตควรเป็นอย่างไร</label><textarea id="q3" placeholder="เขียนคำตอบของนักเรียน"></textarea></div><div class="q"><label>4. มือและนิ้วควรจัดอย่างไรขณะเซต</label><textarea id="q4" placeholder="เขียนคำตอบของนักเรียน"></textarea></div><div class="q"><label>5. บอลควรสัมผัสบริเวณใดของมือ</label><textarea id="q5" placeholder="เขียนคำตอบของนักเรียน"></textarea></div><div class="q"><label>6. เหตุใดจึงต้องเคลื่อนที่เข้าหาบอลก่อนเซต</label><textarea id="q6" placeholder="เขียนคำตอบของนักเรียน"></textarea></div><div class="q"><label>7. การเซตให้เพื่อนควรควบคุมอะไรบ้าง</label><textarea id="q7" placeholder="เขียนคำตอบของนักเรียน"></textarea></div><div class="q"><label>8. ข้อผิดพลาดที่พบบ่อยในการเซตมีอะไรบ้าง</label><textarea id="q8" placeholder="เขียนคำตอบของนักเรียน"></textarea></div><div class="q"><label>9. การเซตที่ดีช่วยสร้างโอกาสในการทำคะแนนอย่างไร</label><textarea id="q9" placeholder="เขียนคำตอบของนักเรียน"></textarea></div><div class="q"><label>10. นักเรียนจะนำทักษะการเซตไปใช้ในการเล่นจริงอย่างไร</label><textarea id="q10" placeholder="เขียนคำตอบของนักเรียน"></textarea></div></section><div class="actions"><button onclick="send()">📤 ส่งแบบฝึกออนไลน์</button></div><section id="result" class="card result"><h2>✅ ส่งงานเรียบร้อยแล้ว</h2><p id="msg"></p><a class="back" href="volleyball-lesson2-mindmap.html">ไปทำ Mind Map เรื่องที่ 2 →</a></section></div><script>const URL='https://script.google.com/macros/s/AKfycbyF8YC2k1-WEvmELvNKgzCHkEpoQrYhR8BSUUPozcsiNANAFaxHaUn4e5LUGvr8_zocMQ/exec';async function send(){const name=document.getElementById('name').value.trim(),cls=document.getElementById('class').value,no=document.getElementById('no').value;if(!name||!cls||!no){alert('กรุณากรอกข้อมูลนักเรียนให้ครบครับ');return}for(let i=1;i<=10;i++)if(!document.getElementById('q'+i).value.trim()){alert('กรุณาตอบให้ครบทั้ง 10 ข้อครับ');return}const p={name,class:cls,no,work:'แบบฝึกออนไลน์ เรื่องที่ 2 การเซตบอล',attempt:1,submissionType:'online_practice',quizType:'แบบฝึกออนไลน์ เรื่องที่ 2'};for(let i=1;i<=10;i++)p['q'+i]=document.getElementById('q'+i).value.trim();await fetch(URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});document.getElementById('result').style.display='block';document.getElementById('msg').textContent='คุณ '+name+' ห้อง '+cls+' เลขที่ '+no+' ส่งแบบฝึกออนไลน์ เรื่องที่ 2 แล้ว';document.querySelectorAll('input,select,textarea,button').forEach(x=>x.disabled=true);document.getElementById('result').scrollIntoView({behavior:'smooth'})}</script></body></html>
