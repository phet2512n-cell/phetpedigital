<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบทดสอบหลังเรียนกระโดดไกล | พ22103</title><style>html,body{margin:0;height:100%;background:#f5f8ff}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="quiz" src="field-events-quiz.html" title="แบบทดสอบหลังเรียนกระโดดไกล"></iframe><script>const TARGET='กระโดดไกล';const frame=document.getElementById('quiz');frame.addEventListener('load',()=>{try{const d=frame.contentDocument;d.querySelector('header h1').textContent='แบบทดสอบหลังเรียน : '+TARGET;d.querySelector('header p').textContent='พ22103 • จำนวน 10 ข้อ • สำหรับนักเรียนทุกห้อง • แสดงผลและ Feedback หลังส่ง';const btn=[...d.querySelectorAll('#tabs button')].find(b=>b.textContent.trim()===TARGET);if(btn)btn.click();const name=d.getElementById('name');if(name){name.placeholder='ชื่อ-สกุลนักเรียน';name.required=true;}const cls=d.getElementById('classno');if(cls){cls.placeholder='ชั้น / ห้อง เช่น ม.2/1';cls.required=true;}const tabs=d.getElementById('tabs');if(tabs)tabs.style.display='none';}catch(e){console.error(e);}});</script></body></html>
