<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบฝึกออนไลน์ เรื่องที่ 3</title><style>body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f8ff;color:#092653;line-height:1.8}.wrap{max-width:1050px;margin:auto;padding:28px 16px 50px}.hero,.card{background:#fff;border-radius:22px;padding:26px;margin-bottom:18px;box-shadow:0 10px 25px #17315a14}.hero{text-align:center}.ball{font-size:64px}h1{color:#0757a6}h2{color:#0869b8;border-left:5px solid #18aee8;padding-left:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.item{background:#f8fbff;border:1px solid #d9eaf6;border-radius:14px;padding:16px}input,select,textarea{box-sizing:border-box;padding:11px;border:2px solid #d8e7f5;border-radius:12px;font:inherit}.btn,.back{display:inline-block;background:#092653;color:#fff;padding:12px 18px;border-radius:12px;border:0;text-decoration:none;font-weight:bold;cursor:pointer}.box{background:#f3faff;border-left:5px solid #18aee8;padding:15px;border-radius:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="hero"><div class="ball">🏐</div><h1>แบบฝึกออนไลน์ เรื่องที่ 3</h1><p><strong>รหัสวิชา พ23104</strong> • ชั้นมัธยมศึกษาปีที่ 3</p><h2>ทบทวนทักษะการอันเดอร์</h2><p>แบบฝึกนี้ไม่มีคะแนนและไม่ส่งข้อมูลเข้าระบบ</p></section><div id="q"></div><section class="card" style="text-align:center"><button class="btn" onclick="check()">ตรวจคำตอบ</button></section><section id="r" class="card" style="display:none"></section></div><script>const d=[["การเล่นลูกสองมือล่างหรือการอันเดอร์คืออะไร?","ใช้แขนท่อนล่างของทั้งสองมือควบคุมหรือส่งลูกไปยังทิศทางหรือตำแหน่งที่ต้องการ"],["การอันเดอร์มีความสำคัญต่อการเล่นวอลเลย์บอลอย่างไร?","เป็นทักษะพื้นฐานสำคัญต่อการเล่นเป็นทีม โดยเฉพาะการรับลูกเสิร์ฟ ลูกตบ และลูกที่มาระดับต่ำ"],["ลักษณะสำคัญของท่าเตรียมพร้อมมีอะไรบ้าง?","หันหน้าเข้าบอล แยกเท้า งอเข่า โน้มตัวพร้อมเคลื่อนที่ มืออยู่ด้านหน้า และมองบอล"],["เพราะเหตุใดจึงควรเคลื่อนที่เข้าหาบอลก่อนทำการอันเดอร์?","เพื่อให้บอลอยู่ด้านหน้าและใกล้แนวกลางลำตัว ทำให้ควบคุมบอลได้ดี"],["การประสานมือสำหรับการอันเดอร์มีวิธีใดบ้าง?","ซ้อนมือ โอบหมัด และกำหมัดทั้งสองข้างชิดกัน"],["บริเวณใดของแขนที่ควรใช้สัมผัสลูกบอล?","บริเวณแขนท่อนล่างเหนือข้อมือ ไม่ใช้มือหรือข้อมือโดยตรง"],["การส่งแรงในการอันเดอร์ควรใช้ส่วนใดของร่างกายร่วมกัน?","ขา ลำตัว และแขนทำงานร่วมกัน โดยย่อเข่าแล้วเหยียดขาและลำตัวเพื่อส่งแรง"],["หากต้องการควบคุมทิศทางของลูกบอล ผู้เล่นควรคำนึงถึงอะไร?","มุมของแขน ทิศทางของแรง และเป้าหมาย"],["ขั้นตอนสำคัญในการรับลูกเสิร์ฟด้วยการอันเดอร์มีอะไรบ้าง?","เตรียมพร้อม → มองบอล → เคลื่อนที่ → สร้างแขนรับบอล → สัมผัสบอล → ส่งไปยังเพื่อนหรือเป้าหมาย"],["ยกตัวอย่างข้อผิดพลาดในการอันเดอร์ 2 ข้อ พร้อมแนวทางแก้ไข","เช่น แขนไม่ชิดกัน → จัดแขนให้เหยียดและชิดกัน; ไม่เคลื่อนที่เข้าหาบอล → เคลื่อนที่ให้บอลอยู่ด้านหน้า"]];const q=document.getElementById('q');d.forEach((x,i)=>q.innerHTML+=`<section class="card"><h2>ข้อ ${i+1}</h2><p><strong>${x[0]}</strong></p><textarea id="a${i}" style="width:100%;min-height:90px"></textarea></section>`);function check(){if(d.some((_,i)=>!document.getElementById('a'+i).value.trim())){alert('กรุณาตอบให้ครบ 10 ข้อครับ');return}let s='<h2>✅ แนวคำตอบ</h2>';d.forEach((x,i)=>s+=`<div class="item"><strong>ข้อ ${i+1}</strong><p>คำตอบของฉัน: ${document.getElementById('a'+i).value}</p><p><strong>แนวคำตอบ:</strong> ${x[1]}</p></div>`);document.getElementById('r').innerHTML=s;document.getElementById('r').style.display='block';}</script></body></html>
