<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบฝึกออนไลน์ เรื่องที่ 3</title><style>body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f8ff;color:#092653;line-height:1.8}.wrap{max-width:1050px;margin:auto;padding:28px 16px 50px}.hero,.card{background:#fff;border-radius:22px;padding:26px;margin-bottom:18px;box-shadow:0 10px 25px #17315a14}.hero{text-align:center}.ball{font-size:64px}h1{color:#0757a6}h2{color:#0869b8;border-left:5px solid #18aee8;padding-left:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.item{background:#f8fbff;border:1px solid #d9eaf6;border-radius:14px;padding:16px}input,select,textarea{box-sizing:border-box;padding:11px;border:2px solid #d8e7f5;border-radius:12px;font:inherit}.btn,.back{display:inline-block;background:#092653;color:#fff;padding:12px 18px;border-radius:12px;border:0;text-decoration:none;font-weight:bold;cursor:pointer}.box{background:#f3faff;border-left:5px solid #18aee8;padding:15px;border-radius:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="hero"><div class="ball">🏐</div><h1>แบบฝึกออนไลน์ เรื่องที่ 3</h1><p><strong>รหัสวิชา พ23104</strong> • ชั้นมัธยมศึกษาปีที่ 3</p><h2>ทบทวนทักษะการอันเดอร์</h2><p>แบบฝึกนี้ไม่มีคะแนนและไม่ส่งข้อมูลเข้าระบบ</p></section><div id="q"></div><section class="card" style="text-align:center"><button class="btn" onclick="check()">ตรวจคำตอบ</button></section><section id="r" class="card" style="display:none"></section></div><script>const d=[["การอันเดอร์คืออะไร?","การใช้แขนท่อนล่างควบคุมหรือส่งบอลไปยังทิศทาง/ตำแหน่งที่ต้องการ"],["ท่าเตรียมเป็นอย่างไร?","หันหน้าเข้าบอล แยกเท้า ย่อเข่า พร้อมเคลื่อนที่และมองบอล"],["เมื่อบอลอยู่ด้านข้างควรทำอย่างไร?","เคลื่อนที่เข้าหาบอลและจัดบอลให้อยู่ด้านหน้า/กึ่งกลางลำตัว"],["วิธีจับมือมีอะไรบ้าง?","ซ้อนมือ โอบหมัด และกำหมัดทั้งสองข้างชิดกัน"],["จุดสัมผัสบอลอยู่ที่ใด?","ท่อนแขนเหนือข้อมือประมาณหนึ่งฝ่ามือ/ประมาณ 10 เซนติเมตร"],["การย่อเข่าและถ่ายน้ำหนักช่วยอย่างไร?","ช่วยสร้างแรงและควบคุมทิศทางให้สัมพันธ์กับเป้าหมาย"],["อะไรช่วยควบคุมทิศทาง?","ตำแหน่งเท้า มุมแขน ลำตัว จุดสัมผัส และเป้าหมาย"],["การรับเสิร์ฟมีเป้าหมายอะไร?","ควบคุมบอลให้เพื่อนสามารถเล่นต่อได้"],["ข้อผิดพลาดมีอะไรบ้าง?","เช่น ไม่เคลื่อนที่ แขนไม่ชิด แกว่งแขนแรง มองบอลไม่ต่อเนื่อง เสียสมดุล"],["ลำดับทักษะที่ควรจำคืออะไร?","เตรียมตัว → เคลื่อนที่ → จัดมือ → สร้างแขนรับ → สัมผัสบอล → ส่งไปเป้าหมาย"]];const q=document.getElementById('q');d.forEach((x,i)=>q.innerHTML+=`<section class="card"><h2>ข้อ ${i+1}</h2><p><strong>${x[0]}</strong></p><textarea id="a${i}" style="width:100%;min-height:90px"></textarea></section>`);function check(){if(d.some((_,i)=>!document.getElementById('a'+i).value.trim())){alert('กรุณาตอบให้ครบ 10 ข้อครับ');return}let s='<h2>✅ แนวคำตอบ</h2>';d.forEach((x,i)=>s+=`<div class="item"><strong>ข้อ ${i+1}</strong><p>คำตอบของฉัน: ${document.getElementById('a'+i).value}</p><p><strong>แนวคำตอบ:</strong> ${x[1]}</p></div>`);document.getElementById('r').innerHTML=s;document.getElementById('r').style.display='block';}</script></body></html>
