<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบทดสอบหลังเรียนขว้างจักร ม.2/2</title><style>html,body{margin:0;height:100%;background:#f5f8ff}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="quiz" src="field-events-quiz.html" title="แบบทดสอบหลังเรียนขว้างจักร ม.2/2"></iframe><script>const TARGET='ขว้างจักร';const frame=document.getElementById('quiz');frame.addEventListener('load',()=>{try{const d=frame.contentDocument;d.querySelector('header h1').textContent='แบบทดสอบหลังเรียน : '+TARGET;d.querySelector('header p').textContent='ม.2/2 • พ22103 • จำนวน 10 ข้อ • แสดงผลและ Feedback หลังส่ง';const btn=[...d.querySelectorAll('#tabs button')].find(b=>b.textContent.trim()===TARGET);if(btn)btn.click();const old=d.getElementById('classno');if(old&&old.tagName!=='SELECT'){const s=d.createElement('select');s.id='classno';s.required=true;s.innerHTML='<option value="" selected disabled>เลือกเลขที่ (ม.2/2)</option>'+Array.from({length:40},(_,i)=>`<option value="ม.2/2 เลขที่ ${i+1}">ม.2/2 เลขที่ ${i+1}</option>`).join('');old.replaceWith(s);}const name=d.getElementById('name');if(name){name.placeholder='ชื่อ-สกุลนักเรียน ม.2/2';name.required=true;}const tabs=d.getElementById('tabs');if(tabs)tabs.style.display='none';const st=d.createElement('style');st.textContent='.student select{padding:12px;border:1px solid #bfd0e6;border-radius:10px;font-size:16px;background:#fff;color:#15345d}';d.head.appendChild(st);}catch(e){console.error(e);}});</script></body></html>
