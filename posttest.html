<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post-test กรีฑา พ22103</title><style>body{font-family:Tahoma,Arial;background:#f4f7fc;color:#15345d;margin:0}.wrap{max-width:850px;margin:auto;padding:30px}.head{background:linear-gradient(120deg,#07386d,#0c64c7);color:white;padding:28px;border-radius:20px}.q{background:white;margin:15px 0;padding:20px;border-radius:16px;box-shadow:0 8px 20px #0001}.q label{display:block;padding:5px}.btn{border:0;background:#38c787;color:#052d20;font-weight:bold;padding:14px 20px;border-radius:12px;font-size:17px;cursor:pointer}.result{font-size:24px;font-weight:bold;margin:20px 0}.feedback{background:#fff8d7;padding:15px;border-radius:12px}.back{color:#0c64c7}</style></head><body><div class="wrap"><div class="head"><h1>แบบทดสอบหลังเรียน</h1><p>กีฬาประเภทลาน: กระโดดสูงและกระโดดไกล | 10 ข้อ | ตรวจคะแนนอัตโนมัติ</p></div><form id="quiz"></form><button class="btn" onclick="grade()">ส่งคำตอบและดูผล</button><div id="result" class="result"></div><div id="feedback"></div><a class="back" href="athletics-m2.html">← กลับบทเรียน</a></div><script>const qs=[['ลำดับทักษะพื้นฐานที่ถูกต้องคือข้อใด?','Approach → Take-off → Flight → Landing','Flight → Landing → Approach → Take-off','Landing → Approach → Flight → Take-off','Take-off → Landing → Approach → Flight',0],['จุดสำคัญของ Approach คืออะไร?','เข้าหาจุดกระโดดด้วยจังหวะควบคุมได้','หยุดนิ่ง','ลงพื้น','นั่งพัก',0],['Take-off มีเป้าหมายหลักใด?','สร้างแรงส่งตัวขึ้นจากพื้น','ลดความสูง','หยุดการเคลื่อนที่','วัดระยะ',0],['ท่ากรรไกรใช้ลักษณะขาแบบใด?','ขานำข้ามแล้วสลับขาตาม','เท้าชิดตลอด','คุกเข่า','นั่งข้าม',0],['การยืนกระโดดไกลสองเท้าใช้ส่วนใดช่วยสร้างแรง?','การย่อเข่าและเหวี่ยงแขน','การนั่ง','การก้มศีรษะอย่างเดียว','การหยุดแขน',0],['การลงยืนกระโดดไกลที่เหมาะสมคือข้อใด?','เท้าทั้งสองลงพร้อมย่อเข่ารับแรง','ขาเดียวเหยียดแข็ง','ใช้มือรับพื้นก่อน','ลงส้นเท้าแล้วล็อกเข่า',0],['เหตุใดต้องปรับบ่อทรายให้เรียบ?','ช่วยให้พื้นที่ลงปลอดภัยและตรวจสิ่งแปลกปลอม','เพื่อให้ลื่น','เพื่อให้แข็ง','เพื่อวิ่งเร็วขึ้น',0],['หากเพื่อนยังอยู่ในพื้นที่ลงควรทำอย่างไร?','รอจนพื้นที่ว่าง','กระโดดทันที','ตะโกนแล้วกระโดด','วิ่งผ่าน',0],['การอบอุ่นร่างกายก่อนฝึกมีความสำคัญอย่างไร?','เตรียมร่างกายให้พร้อมต่อกิจกรรม','ทำให้เหนื่อยก่อน','ใช้แทนการฝึก','ไม่มีความจำเป็น',0],['หลังเรียน นักเรียนควรทำสิ่งใดเพื่อทบทวนความเข้าใจ?','ทำแบบทดสอบและตรวจผล','ข้ามบทเรียน','ไม่ต้องทบทวน','ดูเฉพาะคะแนนเพื่อน',0]];let h='';qs.forEach((q,i)=>{h+=`<div class="q"><b>${i+1}. ${q[0]}</b>`;for(let j=1;j<=4;j++)h+=`<label><input type="radio" name="q${i}" value="${j-1}"> ${q[j]}</label>`;h+='</div>'});document.getElementById('quiz').innerHTML=h;function grade(){let s=0,miss=[];qs.forEach((q,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`);if(a&&+a.value===q[5])s++;else miss.push(i+1)});document.getElementById('result').innerHTML=`คะแนน ${s}/10 — ${s>=8?'ผ่านเกณฑ์ 80% ✓':'ควรกลับไปทบทวนบทเรียนอีกครั้ง'}`;document.getElementById('feedback').innerHTML=miss.length?`<div class="feedback">ข้อที่ควรทบทวน: ${miss.join(', ')}</div>`:'<div class="feedback">ยอดเยี่ยม ตอบถูกครบทุกข้อ</div>';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}</script></body></html>
