<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบทดสอบหลังเรียน หน่วยการเรียนรู้ที่ 3 | พ22103</title><style>*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f4f7fc;color:#15345d;margin:0}.wrap{max-width:900px;margin:auto;padding:28px 16px}.head{background:linear-gradient(120deg,#07386d,#0c64c7);color:white;padding:30px;border-radius:20px}.head h1{margin:0 0 6px}.student,.q{background:white;margin:15px 0;padding:20px;border-radius:16px;box-shadow:0 8px 20px #0001}.student{display:grid;grid-template-columns:2fr 1fr;gap:10px}.student input{padding:12px;border:1px solid #bdd0e6;border-radius:10px;font-size:16px}.topic{display:inline-block;padding:4px 10px;border-radius:999px;background:#e9f3ff;color:#0757a8;font-size:13px;font-weight:bold}.q label{display:block;padding:7px;border-radius:8px}.q label:hover{background:#f3f7ff}.btn{border:0;background:#38c787;color:#052d20;font-weight:bold;padding:14px 20px;border-radius:12px;font-size:17px;cursor:pointer}.result{font-size:22px;font-weight:bold;margin:20px 0;padding:15px;background:#eaf9ef;border-radius:12px;display:none}.feedback{margin:12px 0;padding:12px;border-radius:10px;background:#fff8d7}.ok{background:#eaf9ef}.bad{background:#fff0ef}.back{display:inline-block;margin-top:15px;color:#0c64c7;text-decoration:none;font-weight:bold}@media(max-width:650px){.student{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div>รายวิชา พ22103 กรีฑา • ชั้นมัธยมศึกษาปีที่ 2</div><h1>แบบทดสอบหลังเรียน</h1><h2>หน่วยการเรียนรู้ที่ 3 เรื่องกีฬากรีฑา (กีฬาประเภทลาน)</h2><p>กระโดดสูง • กระโดดไกล • ขว้างจักร • ทุ่มน้ำหนัก | 10 ข้อ | เกณฑ์ผ่าน 80%</p></div><div class="student"><input id="name" placeholder="ชื่อ-สกุลนักเรียน"><input id="classno" placeholder="ชั้น / เลขที่"></div><form id="quiz"></form><button class="btn" onclick="grade(event)">ส่งคำตอบและดูผลหลังเรียน</button><div id="result" class="result"></div><div id="feedback"></div><a class="back" href="athletics-m2.html">← กลับหน้าหน่วยการเรียนรู้ที่ 3</a></div><script>const API='https://script.google.com/macros/s/AKfycbyXDIT6ZKqA1zyEIoa_NNYDO9uG4-6b6tUNYoOoC0hqMgvZDCKNR97bmQHt4TXIgn7yYg/exec';const qs=[['กระโดดสูง','Approach ที่ดีในการกระโดดสูงควรมีลักษณะอย่างไร',['วิ่งเร็วที่สุดโดยไม่สนใจจังหวะ','มีจังหวะสม่ำเสมอและควบคุมความเร็ว','หยุดก่อนถึงจุดส่งตัว','เปลี่ยนก้าวตลอดเวลา'],1,'Approach ที่ดีต้องควบคุมจังหวะ ความเร็ว และการเข้าหาจุดส่งตัว'],['กระโดดสูง','ท่ากรรไกรมีลักษณะเด่นอย่างไร',['ขาทั้งสองข้ามพร้อมกัน','ใช้มือดึงตัวผ่านเชือก','ขานำข้ามก่อนแล้วสลับขาตาม','หมุนตัวหลายรอบก่อนข้าม'],2,'ท่ากรรไกรใช้การสลับขา โดยขานำผ่านก่อนและขาตามผ่านต่อเนื่อง'],['กระโดดสูง','Landing ที่เหมาะสมควรเน้นข้อใด',['ความปลอดภัยและการลดแรงกระแทก','การลงให้เร็วที่สุด','การลงนอกพื้นที่','การเหยียดเข่าตึงตลอด'],0,'การลงต้องควบคุมร่างกายและลดแรงกระแทกอย่างปลอดภัย'],['กระโดดไกล','Approach ในการกระโดดไกลมีหน้าที่สำคัญอย่างไร',['ลดแรงส่ง','สร้างความเร็วและจังหวะก่อน Take-off','หยุดตัวก่อนกระโดด','ทำให้ลอยตัวโดยไม่ใช้ขา'],1,'Approach ช่วยสร้างความเร็วและจังหวะเพื่อเชื่อมสู่ Take-off'],['กระโดดไกล','ก่อนลงบ่อทรายควรเตรียมร่างกายอย่างไร',['เหยียดขาและเท้าไปด้านหน้าอย่างเหมาะสม','ดึงขาไปด้านหลังตลอด','ใช้ขาข้างเดียวลงเท่านั้น','กางขาออกด้านข้างมากที่สุด'],0,'การเตรียมเท้าและขาไปด้านหน้าช่วยให้ลงได้มีประสิทธิภาพและปลอดภัย'],['กระโดดไกล','ข้อใดช่วยรักษาระยะหลังลงบ่อทรายได้ดีกว่า',['ล้มถอยหลัง','ควบคุมสมดุลและเคลื่อนไปข้างหน้า','นั่งลงทันที','ใช้มือแตะทรายด้านหลัง'],1,'ควรควบคุมร่างกายไม่ให้ส่วนใดแตะทรายด้านหลังจุดลง'],['ขว้างจักร','เหตุใดการประสานขา สะโพก ลำตัว และแขนจึงสำคัญในการขว้างจักร',['ช่วยถ่ายทอดแรงต่อเนื่องไปสู่อุปกรณ์','ช่วยลดระยะทาง','ใช้แทนการทรงตัว','ทำให้ไม่ต้องควบคุมทิศทาง'],0,'การขว้างจักรต้องถ่ายทอดแรงต่อเนื่องจากส่วนต่าง ๆ ของร่างกาย'],['ขว้างจักร','หลังปล่อยจักรแล้วควรทำสิ่งใด',['วิ่งตามจักรทันที','รักษาสมดุลและควบคุมร่างกายในวง','เดินออกด้านหน้าโดยไม่รอ','หันหลังให้พื้นที่ตก'],1,'หลังปล่อยต้องควบคุมสมดุลและปฏิบัติตามกติกาในวงขว้าง'],['ทุ่มน้ำหนัก','ลักษณะการออกแรงที่ถูกต้องในการทุ่มน้ำหนักคือข้อใด',['ผลักลูกน้ำหนักออกจากบริเวณใกล้คอ/ไหล่','เหวี่ยงแขนแบบขว้างไกล','โยนลูกด้วยสองมือเหนือศีรษะ','กลิ้งลูกไปกับพื้น'],0,'ทุ่มน้ำหนักใช้การผลักลูกจากบริเวณใกล้คอหรือไหล่ ไม่ใช่การเหวี่ยงขว้าง'],['ทุ่มน้ำหนัก','ข้อใดเป็นหลักความปลอดภัยที่สำคัญที่สุดในการฝึกทุ่มน้ำหนัก',['เก็บลูกทันทีหลังทุกคนทุ่มโดยไม่รอสัญญาณ','ให้ผู้เรียนยืนกระจายทั่วพื้นที่ตก','ตรวจว่าพื้นที่ทุ่มและพื้นที่ตกปลอดคนก่อนเริ่ม','ทุ่มพร้อมกันหลายคนเพื่อประหยัดเวลา'],2,'ต้องตรวจพื้นที่ทุ่มและพื้นที่ตกให้ปลอดคน และปฏิบัติตามสัญญาณครู']];document.getElementById('quiz').innerHTML=qs.map((q,i)=>`<div class="q"><span class="topic">${q[0]}</span><p><b>${i+1}. ${q[1]}</b></p>${q[2].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('');async function grade(e){e.preventDefault();let name=document.getElementById('name').value.trim(),classno=document.getElementById('classno').value.trim();if(!name||!classno){alert('กรุณากรอกชื่อ-สกุล และชั้น/เลขที่');return}let ans=[],score=0,html='';for(let i=0;i<qs.length;i++){let a=document.querySelector(`input[name=q${i}]:checked`);if(!a){alert('กรุณาตอบให้ครบทั้ง 10 ข้อ');return}let v=+a.value;ans.push(v);let ok=v===qs[i][3];if(ok)score++;html+=`<div class="feedback ${ok?'ok':'bad'}"><b>ข้อ ${i+1} ${ok?'✓ ถูกต้อง':'ควรทบทวน'}</b><br>${qs[i][4]}${ok?'':`<br><b>คำตอบที่ถูก:</b> ${'กขคง'[qs[i][3]]}. ${qs[i][2][qs[i][3]]}`}</div>`}let pass=score>=8,r=document.getElementById('result');r.style.display='block';r.innerHTML=`คะแนนหลังเรียน <b>${score}/10</b> คะแนน — ${pass?'ผ่านเกณฑ์ 80% ✓':'ยังไม่ผ่านเกณฑ์ 80% ควรทบทวนและลองใหม่'}`;document.getElementById('feedback').innerHTML=html;let payload={stage:'หลังเรียน',name,classno,lesson:'หน่วยการเรียนรู้ที่ 3 เรื่องกีฬากรีฑา (กีฬาประเภทลาน)',question:'[หน่วย 3] คะแนนหลังเรียน',answer:`${score}/10 | ${pass?'ผ่าน':'ไม่ผ่าน'} | คำตอบ ${ans.map((x,i)=>`${i+1}:${'กขคง'[x]}`).join(', ')}`};try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})}catch(err){}window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}</script></body></html>
