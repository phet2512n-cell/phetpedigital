<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Map การขว้างจักร | พ22103</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f8ff;color:#17365d}header{background:linear-gradient(120deg,#073b83,#1598df);color:#fff;text-align:center;padding:40px 16px}main{max-width:920px;margin:auto;padding:24px}.center{background:#073b83;color:#fff;border-radius:50%;width:220px;height:220px;margin:15px auto;display:flex;align-items:center;justify-content:center;text-align:center;font-size:28px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 7px 22px #1232;border-left:7px solid #18a66b}.answer{display:none;background:#eafff3;padding:12px;border-radius:10px;margin-top:10px}.btns{text-align:center;margin:24px}.btn{border:0;border-radius:12px;padding:13px 18px;margin:5px;font-weight:900;background:#ffd21f;color:#17365d;text-decoration:none;cursor:pointer}.home{background:#17365d;color:#fff}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><div>พ22103 กรีฑา ม.2</div><h1>Mind Map : การขว้างจักร</h1><p>ทบทวนความรู้ เทคนิค กติกา และความปลอดภัย</p></header><main><div class="center">การขว้างจักร<br>Discus Throw</div><div class="grid" id="map"></div><div class="btns"><button class="btn" onclick="toggle()">ดู/ซ่อนเฉลย</button><a class="btn home" href="throw-lessons-full.html#discus">กลับใบความรู้</a></div></main><script>const data=[['1. เป้าหมาย','ขว้างจักรให้ได้ระยะไกลภายในเขตและตามกติกา'],['2. ลำดับทักษะ','จับ → เตรียม → เหวี่ยง/หมุน → ปล่อย → ทรงตัว'],['3. การส่งแรง','ขา → สะโพก → ลำตัว → ไหล่ → แขน → มือ'],['4. จุดสำคัญ','จับไม่แน่นเกินไป รักษาสมดุล ควบคุมจังหวะและทิศทาง'],['5. กติกา','เริ่มในวง จักรตกในเขต และออกจากวงตามบริเวณที่กำหนด'],['6. ความปลอดภัย','ขว้างตามสัญญาณ ไม่มีคนในเขตตก และรอก่อนเข้าเก็บจักร']];document.getElementById('map').innerHTML=data.map(x=>`<section class="card"><h2>${x[0]}</h2><textarea style="width:100%;min-height:70px" placeholder="เขียนสรุปด้วยคำของนักเรียน"></textarea><div class="answer">${x[1]}</div></section>`).join('');function toggle(){document.querySelectorAll('.answer').forEach(x=>x.style.display=x.style.display==='block'?'none':'block')}</script></body></html>
