<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบทดสอบก่อนเรียน หน่วยการเรียนรู้ที่ 3 | พ22103</title><style>*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f4f7fc;color:#15345d;margin:0}.wrap{max-width:900px;margin:auto;padding:28px 16px}.head{background:linear-gradient(120deg,#071d46,#0c64c7);color:white;padding:30px;border-radius:20px}.head h1{margin:0 0 6px}.student,.q{background:white;margin:15px 0;padding:20px;border-radius:16px;box-shadow:0 8px 20px #0001}.student{display:grid;grid-template-columns:2fr 1fr;gap:10px}.student input{padding:12px;border:1px solid #bdd0e6;border-radius:10px;font-size:16px}.topic{display:inline-block;padding:4px 10px;border-radius:999px;background:#e9f3ff;color:#0757a8;font-size:13px;font-weight:bold}.q label{display:block;padding:7px;border-radius:8px}.q label:hover{background:#f3f7ff}.btn{border:0;background:#ffd21f;color:#082453;font-weight:bold;padding:14px 20px;border-radius:12px;font-size:17px;cursor:pointer}.result{font-size:22px;font-weight:bold;margin:20px 0;padding:15px;background:#fff8d9;border-radius:12px;display:none}.back{display:inline-block;margin-top:15px;color:#0c64c7;text-decoration:none;font-weight:bold}@media(max-width:650px){.student{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div>รายวิชา พ22103 กรีฑา • ชั้นมัธยมศึกษาปีที่ 2</div><h1>แบบทดสอบก่อนเรียน</h1><h2>หน่วยการเรียนรู้ที่ 3 เรื่องกีฬากรีฑา (กีฬาประเภทลาน)</h2><p>กระโดดสูง • กระโดดไกล • ขว้างจักร • ทุ่มน้ำหนัก | 10 ข้อ</p><p>ใช้เพื่อสำรวจความรู้เดิมก่อนเรียน จึงแสดงเฉพาะคะแนนรวมหลังส่งคำตอบ</p></div><div class="student"><input id="name" placeholder="ชื่อ-สกุลนักเรียน"><input id="classno" placeholder="ชั้น / เลขที่"></div><form id="quiz"></form><button class="btn" onclick="grade(event)">ส่งคำตอบและดูคะแนนก่อนเรียน</button><div id="result" class="result"></div><a class="back" href="athletics-m2.html">← กลับหน้าหน่วยการเรียนรู้ที่ 3</a></div><script>const API='https://script.google.com/macros/s/AKfycbyXDIT6ZKqA1zyEIoa_NNYDO9uG4-6b6tUNYoOoC0hqMgvZDCKNR97bmQHt4TXIgn7yYg/exec';const qs=[['กระโดดสูง','จุดมุ่งหมายสำคัญของการกระโดดสูงคือข้อใด',['กระโดดให้ไกลที่สุด','ข้ามระดับความสูงที่กำหนด','วิ่งให้เร็วที่สุด','ลงพื้นให้เร็วที่สุด'],1],['กระโดดสูง','ลำดับพื้นฐานของการกระโดดสูงข้อใดถูกต้อง',['Approach → Take-off → Flight → Landing','Flight → Approach → Landing → Take-off','Landing → Take-off → Approach → Flight','Take-off → Flight → Landing → Approach'],0],['กระโดดสูง','ข้อใดเป็นการปฏิบัติที่เหมาะสมก่อนฝึกกระโดดสูง',['เพิ่มความสูงทันที','เริ่มกระโดดโดยไม่อบอุ่นร่างกาย','ตรวจพื้นที่และอุปกรณ์ก่อนฝึก','ยืนในพื้นที่ลงขณะเพื่อนกระโดด'],2],['กระโดดไกล','จุดมุ่งหมายหลักของการกระโดดไกลคือข้อใด',['สร้างระยะทางไปข้างหน้าให้มากที่สุด','กระโดดให้สูงที่สุด','ลอยตัวให้นานที่สุดโดยไม่ลงพื้น','วิ่งให้ช้าที่สุดก่อนกระโดด'],0],['กระโดดไกล','Take-off ในการกระโดดไกลหมายถึงอะไร',['การวิ่งเข้าหา','การส่งตัวขึ้นจากพื้น','การลอยตัว','การลงสู่บ่อทราย'],1],['กระโดดไกล','พื้นที่ลงที่เหมาะสมสำหรับการกระโดดไกลคือข้อใด',['พื้นปูน','สนามหญ้าแข็ง','บ่อทรายที่ตรวจความปลอดภัยแล้ว','ลู่วิ่ง'],2],['ขว้างจักร','จุดมุ่งหมายของการขว้างจักรคือข้อใด',['ขว้างให้สูงที่สุด','ขว้างให้ได้ระยะไกลตามกติกา','กลิ้งจักรไปบนพื้น','ขว้างให้ตกใกล้ตัว'],1],['ขว้างจักร','การขว้างจักรควรให้ความสำคัญกับเรื่องใดมากที่สุดระหว่างการฝึก',['สีของจักร','จำนวนผู้ชม','ทิศทางและความปลอดภัยของพื้นที่ขว้าง','ความดังของเสียงเชียร์'],2],['ทุ่มน้ำหนัก','ข้อใดอธิบายการทุ่มน้ำหนักได้ถูกต้อง',['เหวี่ยงลูกออกจากลำตัวแบบขว้าง','ผลักลูกน้ำหนักออกจากบริเวณใกล้คอ/ไหล่','เตะลูกน้ำหนักไปข้างหน้า','กลิ้งลูกน้ำหนักออกจากวง'],1],['ทุ่มน้ำหนัก','หลังทุ่มน้ำหนักควรทำอย่างไร',['รักษาสมดุลและอยู่ภายในวงตามกติกา','วิ่งออกด้านหน้าทันที','หันหลังให้พื้นที่ตก','เดินไปเก็บลูกทันทีโดยไม่รอสัญญาณ'],0]];document.getElementById('quiz').innerHTML=qs.map((q,i)=>`<div class="q"><span class="topic">${q[0]}</span><p><b>${i+1}. ${q[1]}</b></p>${q[2].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('');async function grade(e){e.preventDefault();let name=document.getElementById('name').value.trim(),classno=document.getElementById('classno').value.trim();if(!name||!classno){alert('กรุณากรอกชื่อ-สกุล และชั้น/เลขที่');return}let ans=[],score=0;for(let i=0;i<qs.length;i++){let a=document.querySelector(`input[name=q${i}]:checked`);if(!a){alert('กรุณาตอบให้ครบทั้ง 10 ข้อ');return}let v=+a.value;ans.push(v);if(v===qs[i][3])score++}let r=document.getElementById('result');r.style.display='block';r.innerHTML=`คะแนนก่อนเรียน <b>${score}/10</b> คะแนน<br><small>คะแนนนี้ใช้สำรวจความรู้เดิมก่อนเรียน</small>`;let payload={stage:'ก่อนเรียน',name,classno,lesson:'หน่วยการเรียนรู้ที่ 3 เรื่องกีฬากรีฑา (กีฬาประเภทลาน)',question:'[หน่วย 3] คะแนนก่อนเรียน',answer:`${score}/10 | คำตอบ ${ans.map((x,i)=>`${i+1}:${'กขคง'[x]}`).join(', ')}`};try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})}catch(err){}window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}</script></body></html>
