<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบทดสอบก่อนเรียน 40 ข้อ | พ22103</title><style>*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f4f7fc;color:#15345d;margin:0}.wrap{max-width:920px;margin:auto;padding:28px 16px}.head{background:linear-gradient(120deg,#071d46,#0c64c7);color:#fff;padding:30px;border-radius:20px}.student,.q{background:#fff;margin:15px 0;padding:20px;border-radius:16px;box-shadow:0 8px 20px #0001}.student{display:grid;grid-template-columns:2fr 1fr;gap:10px}.student input{padding:12px;border:1px solid #bdd0e6;border-radius:10px;font-size:16px}.section{margin:30px 0 12px;padding:18px 22px;border-radius:16px;background:#0c64c7;color:#fff;font-size:24px;font-weight:bold}.section small{display:block;font-size:15px;font-weight:normal;margin-top:3px}.q label{display:block;padding:7px;border-radius:8px}.q label:hover{background:#f3f7ff}.btn{border:0;background:#ffd21f;color:#082453;font-weight:bold;padding:14px 20px;border-radius:12px;font-size:17px;cursor:pointer}.result{font-size:22px;font-weight:bold;margin:20px 0;padding:15px;background:#fff8d9;border-radius:12px;display:none}.back{display:inline-block;margin-top:15px;color:#0c64c7;text-decoration:none;font-weight:bold}@media(max-width:650px){.student{grid-template-columns:1fr}.section{font-size:20px}}</style></head><body><div class="wrap"><div class="head"><div>รายวิชา พ22103 กรีฑา • ชั้นมัธยมศึกษาปีที่ 2</div><h1>แบบทดสอบก่อนเรียน 40 ข้อ</h1><h2>หน่วยการเรียนรู้ที่ 3 เรื่องกีฬากรีฑา (กีฬาประเภทลาน)</h2><p>แบ่งเป็น 4 ตอน เรื่องละ 10 ข้อ รวม 40 คะแนน</p><p>ใช้วัดความรู้ก่อนเรียนเพื่อเปรียบเทียบกับแบบทดสอบหลังเรียน โดยไม่แสดงเฉลยหลังส่ง</p></div><div class="student"><input id="name" placeholder="ชื่อ-สกุลนักเรียน"><input id="classno" placeholder="ชั้น / เลขที่"></div><form id="quiz"></form><button class="btn" onclick="grade(event)">ส่งคำตอบและดูคะแนนก่อนเรียน</button><div id="result" class="result"></div><a class="back" href="athletics-m2.html">← กลับหน้าหน่วยการเรียนรู้ที่ 3</a></div><script src="field-events-bank.js"></script><script>const API='https://script.google.com/macros/s/AKfycbyXDIT6ZKqA1zyEIoa_NNYDO9uG4-6b6tUNYoOoC0hqMgvZDCKNR97bmQHt4TXIgn7yYg/exec';const topics=['กระโดดสูง','กระโดดไกล','ขว้างจักร','ทุ่มน้ำหนัก'];const bank=window.FIELD_EVENTS_BANK;const qs=[];let html='';topics.forEach((t,ti)=>{html+=`<div class="section">ตอนที่ ${ti+1} เรื่อง ${t}<small>ข้อ ${ti*10+1}–${ti*10+10} จำนวน 10 ข้อ</small></div>`;bank[t].forEach(q=>{const i=qs.length;qs.push([t,q[0],q[1],q[2],q[3]]);html+=`<div class="q"><p><b>${i+1}. เรื่อง${t}: ${q[0]}</b></p>${q[1].map((o,k)=>`<label><input type="radio" name="q${i}" value="${k}"> ${'กขคง'[k]}. ${o}</label>`).join('')}</div>`;});});document.getElementById('quiz').innerHTML=html;async function grade(e){e.preventDefault();let name=document.getElementById('name').value.trim(),classno=document.getElementById('classno').value.trim();if(!name||!classno)return alert('กรุณากรอกชื่อ-สกุล และชั้น/เลขที่');let ans=[],score=0;for(let i=0;i<40;i++){let a=document.querySelector(`input[name=q${i}]:checked`);if(!a)return alert('กรุณาตอบให้ครบทั้ง 40 ข้อ');let v=+a.value;ans.push(v);if(v===qs[i][3])score++;}let pct=score/40*100,r=document.getElementById('result');r.style.display='block';r.innerHTML=`คะแนนก่อนเรียน <b>${score}/40</b> คะแนน (${pct.toFixed(1)}%)<br><small>คะแนนนี้ใช้เป็นข้อมูลก่อนเรียนสำหรับเปรียบเทียบผลสัมฤทธิ์หลังเรียน</small>`;let payload={stage:'ก่อนเรียน',name,classno,lesson:'หน่วยการเรียนรู้ที่ 3 เรื่องกีฬากรีฑา (กีฬาประเภทลาน)',question:'[หน่วย 3] คะแนนก่อนเรียน 40 ข้อ',answer:`${score}/40 | ${pct.toFixed(1)}% | คำตอบ ${ans.map((x,i)=>`${i+1}:${'กขคง'[x]}`).join(', ')}`};try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})}catch(err){}window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}</script></body></html>
