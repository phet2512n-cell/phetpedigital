<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pre-test กรีฑา พ22103</title><style>body{font-family:Tahoma,Arial;background:#f4f7fc;color:#15345d;margin:0}.wrap{max-width:850px;margin:auto;padding:30px}.head{background:#082453;color:white;padding:28px;border-radius:20px}.q{background:white;margin:15px 0;padding:20px;border-radius:16px;box-shadow:0 8px 20px #0001}.q label{display:block;padding:5px}.btn{border:0;background:#ffd21f;color:#082453;font-weight:bold;padding:14px 20px;border-radius:12px;font-size:17px;cursor:pointer}.result{font-size:24px;font-weight:bold;margin:20px 0}.back{color:#0c64c7}</style></head><body><div class="wrap"><div class="head"><h1>แบบทดสอบก่อนเรียน</h1><p>กีฬาประเภทลาน: กระโดดสูงและกระโดดไกล | 10 ข้อ</p></div><form id="quiz"></form><button class="btn" onclick="grade()">ส่งคำตอบและดูคะแนน</button><div id="result" class="result"></div><a class="back" href="athletics-m2.html">← กลับบทเรียน</a></div><script>const qs=[['ขั้นใดเป็นการเข้าหาจุดกระโดด?','Approach','Flight','Landing','Recovery',0],['Take-off หมายถึงอะไร?','การอบอุ่นร่างกาย','การส่งตัวขึ้นจากพื้น','การลงพื้น','การพัก',1],['Flight คือช่วงใด?','ช่วงลอยตัว','ช่วงวิ่ง','ช่วงพัก','ช่วงวัดระยะ',0],['Landing หมายถึงอะไร?','การออกตัว','การลอยตัว','การลงสู่พื้น','การวิ่ง',2],['ท่ากรรไกรสัมพันธ์กับกีฬาใดในบทเรียน?','กระโดดสูง','วิ่งผลัด','ทุ่มน้ำหนัก','วิ่งข้ามรั้ว',0],['ยืนกระโดดไกลสองเท้าเริ่มจากข้อใด?','ย่อเข่าและเหวี่ยงแขน','นอนราบ','ยืนขาเดียวตลอด','หันหลัง',0],['พื้นที่ลงของการกระโดดไกลที่เรียนคืออะไร?','พื้นปูน','บ่อทราย','พื้นกระเบื้อง','โต๊ะ',1],['ก่อนฝึกควรทำอะไร?','อบอุ่นร่างกาย','เร่งกระโดดทันที','ถอดรองเท้า','ผลักเพื่อน',0],['การลงจากยืนกระโดดไกลควรทำอย่างไร?','ลงเท้าทั้งสองและย่อเข่า','ลงศีรษะ','ลงเข่าตรงแข็ง','ลงมือก่อน',0],['เมื่อพื้นที่ลงยังมีเพื่อนอยู่ควรทำอย่างไร?','กระโดดต่อทันที','รอจนพื้นที่ว่าง','วิ่งชน','ข้ามคิว',1]];let h='';qs.forEach((q,i)=>{h+=`<div class="q"><b>${i+1}. ${q[0]}</b>`;for(let j=1;j<=4;j++)h+=`<label><input type="radio" name="q${i}" value="${j-1}"> ${q[j]}</label>`;h+='</div>'});document.getElementById('quiz').innerHTML=h;function grade(){let s=0;qs.forEach((q,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`);if(a&&+a.value===q[5])s++});document.getElementById('result').innerHTML=`คะแนนของคุณ ${s}/10 คะแนน`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}</script></body></html>
