<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="28" fill="#eef6ff"/><rect width="1200" height="92" rx="28" fill="#0b5fb5"/><text x="600" y="55" text-anchor="middle" font-family="Tahoma,Arial" font-size="38" font-weight="700" fill="white">การกระโดดสูงแบบผูกเชือก</text><text x="600" y="80" text-anchor="middle" font-family="Tahoma,Arial" font-size="18" fill="#d8efff">ภาพประกอบ 4 ขั้นตอน : วิ่งเข้าหา → ส่งตัวขึ้น → ข้ามเชือก → ลงพื้น</text><rect x="28" y="120" width="1144" height="390" rx="22" fill="white" stroke="#b9d9fa" stroke-width="3"/><line x1="70" y1="405" x2="1130" y2="405" stroke="#36a66b" stroke-width="7"/><line x1="710" y1="185" x2="710" y2="405" stroke="#334e68" stroke-width="8"/><line x1="960" y1="185" x2="960" y2="405" stroke="#334e68" stroke-width="8"/><line x1="710" y1="215" x2="960" y2="215" stroke="#ff7043" stroke-width="7"/><g fill="#2296e6" stroke="#073b72" stroke-width="6" stroke-linecap="round"><circle cx="180" cy="265" r="28"/><path d="M180 295L220 345L275 375M220 345L180 398M218 337L270 310" fill="none"/><circle cx="430" cy="230" r="28"/><path d="M430 260L480 315L535 270M480 315L450 395M480 315L550 370" fill="none"/><circle cx="785" cy="150" r="28"/><path d="M785 180L830 220L900 195M830 220L760 260M830 220L905 265" fill="none"/><circle cx="1040" cy="285" r="28"/><path d="M1040 315L1010 350L960 397M1010 350L1065 397M1010 342L1070 325" fill="none"/></g><g font-family="Tahoma,Arial" font-size="22" font-weight="700" fill="#073b72"><text x="115" y="455">1 วิ่งเข้าหา</text><text x="365" y="455">2 ส่งตัวขึ้น</text><text x="745" y="455">3 ข้ามเชือก</text><text x="995" y="455">4 ลงพื้น</text></g><rect x="28" y="530" width="360" height="92" rx="18" fill="#e8f4ff"/><text x="50" y="562" font-family="Tahoma,Arial" font-size="21" font-weight="700" fill="#0b5fb5">เทคนิคที่ 1 นำขาเดียว</text><text x="50" y="593" font-family="Tahoma,Arial" font-size="17" fill="#334e68">ใช้ขาข้างหนึ่งส่งตัวขึ้น นำอีกข้างข้ามเชือก</text><rect x="420" y="530" width="360" height="92" rx="18" fill="#e8f4ff"/><text x="442" y="562" font-family="Tahoma,Arial" font-size="21" font-weight="700" fill="#0b5fb5">เทคนิคที่ 2 กรรไกร / สลับขา</text><text x="442" y="593" font-family="Tahoma,Arial" font-size="17" fill="#334e68">เหวี่ยงขานำข้ามเชือก แล้วสลับขาตาม</text><rect x="812" y="530" width="360" height="92" rx="18" fill="#fff4e8"/><text x="834" y="562" font-family="Tahoma,Arial" font-size="21" font-weight="700" fill="#e06400">ความปลอดภัย</text><text x="834" y="593" font-family="Tahoma,Arial" font-size="17" fill="#334e68">อบอุ่นร่างกาย ตรวจพื้นที่ และรอพื้นที่ลงว่าง</text></svg>