<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบทดสอบ ม.2/1 | PE Digital</title><style>html,body{margin:0;height:100%;background:#f5f8ff}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="quiz" src="field-events-quiz.html" title="แบบทดสอบ ม.2/1"></iframe><script>const ROOM='ม.2/1';const f=document.getElementById('quiz');f.addEventListener('load',()=>{try{const d=f.contentDocument;const old=d.getElementById('classno');if(!old)return;const s=d.createElement('select');s.id='classno';s.style.cssText=old.style.cssText;s.innerHTML='<option value="">เลือกเลขที่ ('+ROOM+')</option>'+Array.from({length:40},(_,i)=>'<option value="'+ROOM+' เลขที่ '+(i+1)+'">เลขที่ '+(i+1)+'</option>').join('');old.replaceWith(s);}catch(e){console.error(e);}});</script></body></html>
