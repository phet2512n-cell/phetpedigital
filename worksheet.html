<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ใบงานออนไลน์ | กรีฑา พ22103</title><style>:root{--navy:#071d46;--gold:#ffd21f;--soft:#f5f8ff;--green:#168a4d}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--soft);color:#16355e;line-height:1.55}header{background:linear-gradient(120deg,var(--navy),#1375d4);color:#fff;padding:34px 6%;text-align:center}main{max-width:1050px;margin:auto;padding:26px 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 10px 25px #0d255218}.profile{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.profile input,textarea{width:100%;padding:11px;border:2px solid #dce6f4;border-radius:10px;font:inherit}textarea{min-height:82px;resize:vertical}.q b{color:var(--navy)}.answer{display:none;background:#eefaf3;border-left:5px solid var(--green);padding:12px;border-radius:9px;margin-top:10px}.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:24px 0}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:bold;font-size:16px;cursor:pointer}.save{background:var(--gold);color:var(--navy)}.reveal{background:var(--green);color:#fff}.home{background:var(--navy);color:#fff;text-decoration:none}.notice{text-align:center;color:#64748b;font-size:14px}@media(max-width:700px){.profile{grid-template-columns:1fr}}</style></head><body><header><div>ใบงานออนไลน์ • กรีฑา พ22103 • ชั้นมัธยมศึกษาปีที่ 2</div><h1>วิเคราะห์การกระโดดสูงและการกระโดดไกล</h1><p>ทดลองตอบด้วยตนเอง หรือคลิกดูแนวคำตอบเพื่อศึกษาได้ทันที</p></header><main><div class="card profile"><input id="name" placeholder="ชื่อ–สกุล"><input id="room" placeholder="ชั้น/ห้อง"><input id="no" placeholder="เลขที่"></div><div id="questions"></div><div class="buttons"><button class="btn save" onclick="saveAll()">💾 บันทึกคำตอบ</button><button id="reveal" class="btn reveal" onclick="toggleAnswers()">👁 ดูเฉลย</button><a class="btn home" href="athletics-m2.html">← กลับบทเรียน</a></div><p class="notice">ปุ่มดูเฉลยเปิดได้ทันที และกดซ้ำเพื่อซ่อนเฉลยได้</p></main><script>const Q=[['การกระโดดสูงและการกระโดดไกลมี 4 ขั้นพื้นฐานอะไรบ้าง?','Approach, Take-off, Flight และ Landing'],['กระโดดสูงและกระโดดไกลมีเป้าหมายต่างกันอย่างไร?','กระโดดสูงเน้นข้ามระดับความสูง ส่วนกระโดดไกลเน้นสร้างระยะทางไปข้างหน้า'],['เพราะเหตุใด Approach จึงสำคัญ?','ช่วยสร้างจังหวะและความเร็วที่เหมาะสมเพื่อเชื่อมต่อไปยัง Take-off'],['ในขั้น Take-off ผู้เรียนควรทำอะไรให้สัมพันธ์กัน?','ใช้แรงจากขาร่วมกับการเหวี่ยงแขนและการควบคุมลำตัวให้สัมพันธ์กัน'],['Flight มีหน้าที่สำคัญอย่างไร?','ควบคุมร่างกายขณะลอยตัวหรือข้าม เพื่อรักษาสมดุลและเตรียม Landing'],['Landing ที่ดีควรมีลักษณะอย่างไร?','ลงในพื้นที่กำหนดอย่างมั่นคง ควบคุมร่างกาย และลดแรงกระแทกอย่างปลอดภัย'],['ยกตัวอย่างข้อผิดพลาดที่พบบ่อย 2 ข้อ','เช่น วิ่งเร็ว/ช้าเกินไป ก้าวสุดท้ายไม่มั่นคง ดันตัวไม่สัมพันธ์กับแขน เสียสมดุลระหว่างลอยตัว'],['ก่อนฝึกควรตรวจสอบความปลอดภัยเรื่องใดบ้าง?','พื้นที่ อุปกรณ์ ระยะห่าง พื้นที่ลง และปฏิบัติตามสัญญาณของครู'],['Feedback จากครูหรือเพื่อนช่วยพัฒนาทักษะอย่างไร?','ช่วยให้รู้จุดเด่นและจุดที่ต้องปรับ แล้วนำไปฝึกซ้ำอย่างมีเป้าหมาย'],['นักเรียนจะใช้ 4 ขั้นตอนพัฒนาการฝึกของตนเองอย่างไร?','ใช้เป็น Checklist สังเกตทีละขั้น แล้วปรับจังหวะ การขึ้นจากพื้น การควบคุมร่างกาย และการลงสู่พื้น']];const wrap=document.getElementById('questions');Q.forEach((x,i)=>wrap.insertAdjacentHTML('beforeend',`<div class="card q"><b>${i+1}. ${x[0]}</b><textarea id="a${i+1}" placeholder="พิมพ์คำตอบของนักเรียน..."></textarea><div class="answer"><b>แนวคำตอบ:</b> ${x[1]}</div></div>`));const ids=['name','room','no',...Q.map((_,i)=>'a'+(i+1))];let shown=false;function saveAll(){ids.forEach(id=>localStorage.setItem('ws_'+id,document.getElementById(id).value));alert('บันทึกคำตอบไว้ในอุปกรณ์นี้แล้ว');}function toggleAnswers(){shown=!shown;document.querySelectorAll('.answer').forEach(x=>x.style.display=shown?'block':'none');document.getElementById('reveal').textContent=shown?'🙈 ซ่อนเฉลย':'👁 ดูเฉลย';}window.onload=()=>{ids.forEach(id=>{const v=localStorage.getItem('ws_'+id);if(v!==null)document.getElementById(id).value=v});};</script></body></html>
