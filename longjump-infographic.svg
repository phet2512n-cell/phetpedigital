<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="28" fill="#fff7eb"/><rect width="1200" height="92" rx="28" fill="#ef7b00"/><text x="600" y="55" text-anchor="middle" font-family="Tahoma,Arial" font-size="38" font-weight="700" fill="white">การกระโดดไกล</text><text x="600" y="80" text-anchor="middle" font-family="Tahoma,Arial" font-size="18" fill="#fff1d8">ภาพประกอบ 4 ขั้นตอน : วิ่งเข้าหา → ถีบส่ง → ลอยตัว → ลงพื้นทราย</text><rect x="28" y="120" width="1144" height="390" rx="22" fill="white" stroke="#ffd29a" stroke-width="3"/><rect x="800" y="370" width="330" height="55" rx="14" fill="#e6c58d"/><line x1="70" y1="405" x2="1130" y2="405" stroke="#36a66b" stroke-width="7"/><rect x="555" y="378" width="18" height="46" fill="white" stroke="#ef7b00" stroke-width="4"/><path d="M570 350 Q730 150 900 310" fill="none" stroke="#55a9ef" stroke-width="5" stroke-dasharray="12 10"/><g fill="#2296e6" stroke="#073b72" stroke-width="6" stroke-linecap="round"><circle cx="180" cy="265" r="28"/><path d="M180 295L220 345L275 375M220 345L180 398M218 337L270 310" fill="none"/><circle cx="490" cy="225" r="28"/><path d="M490 255L540 305L600 270M540 305L510 395M540 305L605 360" fill="none"/><circle cx="735" cy="165" r="28"/><path d="M735 195L785 235L850 215M785 235L840 285M785 235L730 290" fill="none"/><circle cx="990" cy="290" r="28"/><path d="M990 320L955 350L900 395M955 350L1015 395M960 340L1025 325" fill="none"/></g><g font-family="Tahoma,Arial" font-size="22" font-weight="700" fill="#8a4700"><text x="115" y="455">1 วิ่งเข้าหา</text><text x="430" y="455">2 ถีบส่ง</text><text x="685" y="455">3 ลอยตัว</text><text x="925" y="455">4 ลงพื้นทราย</text></g><rect x="28" y="530" width="360" height="92" rx="18" fill="#fff0da"/><text x="50" y="562" font-family="Tahoma,Arial" font-size="21" font-weight="700" fill="#d96700">เทคนิคที่ 1 ยืนกระโดดไกลสองเท้า</text><text x="50" y="593" font-family="Tahoma,Arial" font-size="17" fill="#5f4a35">ย่อเข่า เหวี่ยงแขน ถีบพื้น และลงสองเท้า</text><rect x="420" y="530" width="360" height="92" rx="18" fill="#fff0da"/><text x="442" y="562" font-family="Tahoma,Arial" font-size="21" font-weight="700" fill="#d96700">เทคนิคที่ 2 กระโดดขาเดียว</text><text x="442" y="593" font-family="Tahoma,Arial" font-size="17" fill="#5f4a35">ใช้ขาข้างเดียวเป็นขาส่ง รักษาสมดุลก่อนลง</text><rect x="812" y="530" width="360" height="92" rx="18" fill="#eef8ef"/><text x="834" y="562" font-family="Tahoma,Arial" font-size="21" font-weight="700" fill="#238347">พื้นที่ลง</text><text x="834" y="593" font-family="Tahoma,Arial" font-size="17" fill="#334e68">บ่อทรายต้องเรียบ ปลอดสิ่งแปลกปลอม และว่าง</text></svg>