<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบทดสอบก่อนเรียน เรื่องที่ 2 | พ23104</title><style>body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef7ff;color:#102a43}.wrap{max-width:980px;margin:auto;padding:28px 16px}.card{background:#fff;border-radius:20px;padding:25px;margin-bottom:18px;box-shadow:0 8px 25px #0b3b6618}.student{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}input,select{width:100%;box-sizing:border-box;padding:12px;border:2px solid #d8e7f5;border-radius:12px;font-size:16px}label{font-weight:bold;color:#0757a6}.option{display:block;border:2px solid #d8e7f5;border-radius:12px;padding:12px;margin:9px 0;cursor:pointer}.q{margin:20px 0}button{border:0;border-radius:14px;padding:14px 25px;background:#0757a6;color:#fff;font-size:17px;font-weight:bold}.result{display:none;text-align:center;background:#ecfff4}.title{display:inline-block;background:#0757a6;color:#fff;padding:6px 14px;border-radius:999px;font-weight:bold}@media(max-width:650px){.student{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="card"><h1>📝 แบบทดสอบก่อนเรียน เรื่องที่ 2</h1><p>การเซตบอลในกีฬาวอลเลย์บอล • พ23104 • ม.3 • ภาคเรียนที่ 2</p><div class="student"><div><label>ชื่อ-นามสกุล</label><input id="name"></div><div><label>ชั้น</label><select id="class"><option value="">เลือกห้อง</option><option>ม.3/1</option><option>ม.3/2</option><option>ม.3/3</option><option>ม.3/4</option><option>ม.3/5</option><option>ม.3/6</option></select></div><div><label>เลขที่</label><select id="no"><option value="">เลือกเลขที่</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option><option>32</option><option>33</option><option>34</option><option>35</option><option>36</option><option>37</option><option>38</option><option>39</option><option>40</option><option>41</option><option>42</option><option>43</option><option>44</option><option>45</option><option>46</option><option>47</option><option>48</option><option>49</option><option>50</option></select></div></div><p>เลือกคำตอบที่ถูกที่สุด 10 ข้อ แบบทดสอบนี้ไม่แสดงเฉลย</p></section><div id="quiz"></div><div style="text-align:center;margin:25px"><button onclick="submitQuiz()">📤 ส่งแบบทดสอบ</button></div><section id="result" class="card result"><h2>ส่งแบบทดสอบเรียบร้อยแล้ว</h2><div id="score" style="font-size:38px;font-weight:900;color:#0757a6"></div><p>ระบบบันทึกผลการทำแบบทดสอบแล้ว และจะไม่แสดงเฉลย</p></section></div><script>const URL='https://script.google.com/macros/s/AKfycbyVpEdhavIE0Q8ccAWax7pF8ql6JAZ7IOBVBPplAW18x5QfpZZ8lZTy3CLCP6T0yt5b0g/exec';const qs=[["การเซตบอลคืออะไร",["การใช้มือและนิ้วควบคุมบอลเหนือศีรษะเพื่อส่งไปยังเป้าหมาย","ใช้เท้าเตะบอล","จับบอลไว้แล้วโยน","ใช้แขนท่อนล่างตีทุกครั้ง"],0],["ก่อนเซตควรจัดมืออย่างไร",["กำมือ","เตรียมมือและนิ้วเหนือบริเวณหน้าผาก","วางมือด้านหลัง","วางแขนลง"],1],["เมื่อต้องเซตบอลด้านข้างควรทำอย่างไร",["ยืนอยู่กับที่","หลับตา","เคลื่อนที่เข้าหาบอลและจัดตำแหน่ง","กระโดดทันที"],2],["จุดสัมผัสบอลที่เหมาะสมคืออะไร",["ข้อศอก","ฝ่ามือเต็ม ๆ","นิ้วมือ","ต้นแขน"],2],["อะไรช่วยให้เซตแม่นยำขึ้น",["ควบคุมแรงและทิศทางสัมพันธ์กับเป้าหมาย","ใช้แรงมากที่สุด","มองพื้น","ไม่ขยับเท้า"],0],["การเซตให้เพื่อนควรคำนึงถึงอะไร",["ตำแหน่งและจังหวะของเพื่อน","จำนวนผู้ชม","สีลูกบอล","เสียงนกหวีดเท่านั้น"],0],["ถ้าบอลลอยห่างควรทำอย่างไร",["เอื้อมอย่างเดียว","เคลื่อนที่ไปอยู่ในตำแหน่งเหมาะสม","ปล่อยตก","หันหลัง"],1],["ข้อใดเป็นข้อผิดพลาด",["เคลื่อนที่เข้าหาบอล","ควบคุมทิศทาง","วางมือและนิ้วไม่ถูกตำแหน่ง","มองบอล"],2],["การฝึกเป็นคู่ช่วยพัฒนาทักษะได้อย่างไร",["ให้ข้อมูลสะท้อนกลับ","บอกว่าเก่งอย่างเดียว","ไม่สังเกต","เปลี่ยนกิจกรรมทุกครั้ง"],0],["การนำทักษะไปใช้จริงที่เหมาะสมคืออะไร",["เซตให้เพื่อนในตำแหน่งที่พร้อมเล่นต่อ","จับบอลไว้","เตะบอล","ยืนอยู่นอกสนาม"],0]];const quiz=document.getElementById('quiz');qs.forEach((q,i)=>{const c=document.createElement('section');c.className='card';c.innerHTML='<span class="title">ข้อ '+(i+1)+'</span><h2>'+q[0]+'</h2>'+q[1].map((o,j)=>'<label class="option"><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>').join('');quiz.appendChild(c)});async function submitQuiz(){const name=document.getElementById('name').value.trim(),cls=document.getElementById('class').value,no=document.getElementById('no').value;if(!name||!cls||!no){alert('กรุณากรอกข้อมูลให้ครบครับ');return}let score=0,p={name,class:cls,no,work:'แบบทดสอบก่อนเรียน เรื่องที่ 2 การเซตบอล',submissionType:'quiz',quizType:'pretest'};for(let i=0;i<10;i++){const s=document.querySelector('input[name="q'+i+'"]:checked');if(!s){alert('กรุณาตอบให้ครบ 10 ข้อครับ');return}p['q'+(i+1)]=Number(s.value);if(Number(s.value)===qs[i][2])score++}await fetch(URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});document.getElementById('score').textContent=score+' / 10 คะแนน';document.getElementById('result').style.display='block';document.querySelectorAll('input,select,button').forEach(x=>x.disabled=true);document.getElementById('result').scrollIntoView({behavior:'smooth'})}</script></body></html>
