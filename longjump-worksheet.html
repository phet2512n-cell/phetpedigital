<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบฝึกหัด Interactive กระโดดไกล | กรีฑา พ22103</title><style>:root{--navy:#071d46;--gold:#ffd21f;--green:#168a4d;--red:#b42318;--amber:#b76e00;--soft:#f5f8ff}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--soft);color:#15345d;line-height:1.6}header{background:linear-gradient(120deg,var(--navy),#1375d4);color:#fff;padding:34px 6%;text-align:center}main{max-width:1050px;margin:auto;padding:26px 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 10px 25px #0d255218}.profile{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.profile input,textarea{width:100%;padding:11px;border:2px solid #dce6f4;border-radius:10px;font:inherit}textarea{min-height:88px}.feedback,.revise{display:none;padding:12px;border-radius:10px;margin-top:10px}.feedback.good{display:block;background:#eefaf3;border-left:5px solid var(--green)}.feedback.mid{display:block;background:#fff8df;border-left:5px solid var(--amber)}.feedback.bad{display:block;background:#fff0ef;border-left:5px solid var(--red)}.revise{background:#f7fbff;border:1px solid #dce8f7}.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:24px}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:bold;font-size:16px;cursor:pointer}.send{background:var(--gold)}.review{background:#38c787}.home{background:var(--navy);color:#fff;text-decoration:none}.status,.done{display:none;padding:14px;border-radius:10px;margin:18px 0;background:#eaf3ff}.done{background:#eefaf3}.notice{text-align:center;color:#64748b}@media(max-width:700px){.profile{grid-template-columns:1fr}}</style></head><body><header><div>แบบฝึกหัดทบทวนแบบโต้ตอบ • กรีฑา พ22103 • ม.2</div><h1>การกระโดดไกล</h1><p>ตอบ → ตรวจรายข้อ → รับ Feedback → แก้จริง → ส่งหลังทบทวน</p></header><main><div class="card profile"><input id="name" placeholder="ชื่อ–สกุล"><input id="room" placeholder="ชั้น/ห้อง"><input id="no" placeholder="เลขที่"></div><div id="questions"></div><div id="status1" class="status"><b>ส่งคำตอบครั้งแรกแล้ว</b><p>กดเพื่อตรวจคำตอบและดู Feedback รายข้อ</p><button class="btn review" onclick="showFeedback()">ตรวจคำตอบและดู Feedback</button></div><div id="done" class="done"><b>✓ ทำแบบฝึกหัดครบกระบวนการแล้ว</b></div><div class="buttons"><button id="send1" class="btn send" onclick="submitBefore()">ส่งคำตอบครั้งที่ 1</button><button id="send2" class="btn review" style="display:none" onclick="submitAfter()">ตรวจและส่งหลังทบทวน</button><a class="btn home" href="athletics-m2.html">← กลับบทเรียน</a></div><p class="notice">ระบบตรวจสาระสำคัญ ไม่จำเป็นต้องใช้ถ้อยคำเหมือนแนวคำตอบทุกคำ</p></main><script>const WEB_APP_URL='https://script.google.com/macros/s/AKfycbyXDIT6ZKqA1zyEIoa_NNYDO9uG4-6b6tUNYoOoC0hqMgvZDCKNR97bmQHt4TXIgn7yYg/exec',LESSON='การกระโดดไกล';const Q=[['การกระโดดไกลมีเป้าหมายสำคัญอย่างไร?','สร้างระยะทางไปข้างหน้าให้ได้มากที่สุด โดยควบคุมทักษะและความปลอดภัย',[['ระยะทาง','ไกล'],['ข้างหน้า'],['ปลอดภัย','ควบคุม']]],['4 ขั้นพื้นฐานของการกระโดดไกลมีอะไรบ้าง?','Approach, Take-off, Flight และ Landing',[['approach','วิ่ง'],['take-off','ส่งตัว'],['flight','ลอยตัว'],['landing','ลง']]],['การยืนกระโดดไกลสองเท้าควรเริ่มจากท่าใด?','ยืนเท้าประมาณกว้างไหล่ ย่อเข่าและเตรียมเหวี่ยงแขน',[['เท้า','กว้างไหล่'],['ย่อเข่า'],['แขน','เหวี่ยง']]],['ขณะ Take-off ของการยืนกระโดดไกลสองเท้าควรทำอย่างไร?','เหวี่ยงแขนไปข้างหน้าพร้อมถีบพื้นด้วยเท้าทั้งสองเพื่อสร้างแรงส่ง',[['เหวี่ยงแขน'],['ถีบพื้น','เท้าทั้งสอง'],['แรงส่ง','ข้างหน้า']]],['เทคนิคกระโดดขาเดียวมีจุดสำคัญอะไร?','ใช้ขาข้างเดียวเป็นขาส่งและรักษาสมดุลของร่างกายขณะลอยตัว',[['ขาเดียว','ขาข้างเดียว'],['ขาส่ง','ส่ง'],['สมดุล']]],['ในขั้น Flight นักเรียนควรควบคุมอะไร?','ควบคุมลำตัว แขน และขาให้สมดุลเพื่อเตรียมการลง',[['ลำตัว'],['แขน','ขา'],['สมดุล','ลง']]],['Landing ที่เหมาะสมในบ่อทรายควรทำอย่างไร?','เตรียมเท้าทั้งสองไปด้านหน้า ลงอย่างสมดุลและย่อเข่ารับแรง',[['เท้าทั้งสอง'],['ด้านหน้า'],['ย่อเข่า','รับแรง'],['สมดุล']]],['เพราะเหตุใดไม่ควรเสียสมดุลถอยหลังหลังลงทราย?','เพราะอาจทำให้จุดสัมผัสด้านหลังใกล้จุดกระโดดมากขึ้นและเสียระยะ',[['ถอยหลัง','ด้านหลัง'],['จุดสัมผัส'],['เสียระยะ','ระยะ']]],['ก่อนฝึกกระโดดไกลต้องตรวจสอบอะไรบ้าง?','ตรวจพื้นที่วิ่ง จุดกระโดด บ่อทราย สิ่งแปลกปลอม และรอให้พื้นที่ลงว่าง',[['พื้นที่วิ่ง'],['จุดกระโดด'],['บ่อทราย'],['สิ่งแปลกปลอม','ว่าง']]],['นักเรียนจะใช้ Feedback เพื่อพัฒนาการกระโดดไกลได้อย่างไร?','นำข้อเสนอแนะมาปรับจังหวะ การส่งตัว การลอยตัว และการลง แล้วฝึกซ้ำอย่างมีเป้าหมาย',[['ข้อเสนอแนะ','feedback'],['ปรับ'],['ฝึกซ้ำ'],['จังหวะ','ส่งตัว','ลอยตัว','ลง']]]];const w=document.getElementById('questions');Q.forEach((x,i)=>w.insertAdjacentHTML('beforeend',`<div class="card"><b>${i+1}. ${x[0]}</b><textarea id="a${i}" placeholder="พิมพ์คำตอบ..."></textarea><div class="feedback" id="f${i}"></div><div class="revise" id="rb${i}"><b>แก้คำตอบหลัง Feedback</b><textarea id="r${i}"></textarea></div></div>`));function v(id){return document.getElementById(id).value.trim()}function n(s){return s.toLowerCase().replace(/\s+/g,' ')}function grade(i,t){let s=n(t),g=Q[i][2],h=g.filter(a=>a.some(k=>s.includes(n(k)))).length,r=h/g.length;return r>=.67?['good','✅ สาระสำคัญถูกต้อง']:r>=.34?['mid','🟡 ถูกบางส่วน ควรเพิ่มเติม']:['bad','❌ ยังไม่ตรงประเด็น']}function render(i,t){let g=grade(i,t),f=document.getElementById('f'+i);f.className='feedback '+g[0];f.innerHTML=`<b>${g[1]}</b><br><b>แนวคำตอบ:</b> ${Q[i][1]}`}function filled(p){return Q.every((_,i)=>v(p+i))}async function send(stage,i,a){let g=grade(i,a);await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({stage,name:v('name'),classno:`${v('room')} เลขที่ ${v('no')}`,lesson:LESSON,question:`[${LESSON}] ข้อ ${i+1}: ${Q[i][0]}`,answer:a,feedback:g[1]})})}async function batch(stage,p){for(let i=0;i<Q.length;i++)await send(stage,i,v(p+i))}async function submitBefore(){if(!v('name')||!v('room')||!v('no')||!filled('a'))return alert('กรุณากรอกข้อมูลและตอบครบ 10 ข้อ');let b=document.getElementById('send1');b.disabled=true;await batch('before','a');Q.forEach((_,i)=>{document.getElementById('a'+i).disabled=true;document.getElementById('r'+i).value=v('a'+i)});['name','room','no'].forEach(x=>document.getElementById(x).disabled=true);b.style.display='none';document.getElementById('status1').style.display='block'}function showFeedback(){Q.forEach((_,i)=>{render(i,v('a'+i));document.getElementById('rb'+i).style.display='block'});document.getElementById('status1').style.display='none';document.getElementById('send2').style.display='inline-block'}async function submitAfter(){if(!filled('r'))return alert('กรุณาแก้คำตอบให้ครบ');let ch=Q.map((_,i)=>n(v('r'+i))!==n(v('a'+i))),need=Q.map((_,i)=>grade(i,v('a'+i))[0]!=='good');if(!ch.some(Boolean))return alert('⚠️ ยังไม่มีคำตอบข้อใดถูกแก้ไข กรุณาปรับคำตอบก่อนส่ง');let nums=need.map((x,i)=>x&&!ch[i]?i+1:null).filter(Boolean);if(nums.length)return alert('⚠️ ข้อที่ควรปรับแต่ยังไม่ได้แก้: '+nums.join(', '));Q.forEach((_,i)=>render(i,v('r'+i)));let b=document.getElementById('send2');b.disabled=true;await batch('after','r');Q.forEach((_,i)=>document.getElementById('r'+i).disabled=true);b.style.display='none';document.getElementById('done').style.display='block'}</script></body></html>
