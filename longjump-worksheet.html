<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ใบงานกระโดดไกล | กรีฑา พ22103</title><style>:root{--navy:#071d46;--blue:#0c64c7;--gold:#ffd21f;--soft:#f5f8ff;--green:#168a4d}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--soft);color:#16355e;line-height:1.55}header{background:linear-gradient(120deg,var(--navy),#1375d4);color:#fff;padding:34px 6%;text-align:center}main{max-width:1050px;margin:auto;padding:26px 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 10px 25px #0d255218}.profile{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.profile input,textarea{width:100%;padding:11px;border:2px solid #dce6f4;border-radius:10px;font:inherit}textarea{min-height:82px;resize:vertical}.q b{color:var(--navy)}.answer{display:none;background:#eefaf3;border-left:5px solid var(--green);padding:12px;border-radius:9px;margin-top:10px}.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:24px 0}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:bold;font-size:16px;cursor:pointer}.save{background:var(--gold);color:var(--navy)}.reveal{background:var(--green);color:#fff}.reveal:disabled{opacity:.45}.home{background:var(--navy);color:#fff;text-decoration:none}@media(max-width:700px){.profile{grid-template-columns:1fr}}</style></head><body><header><div>ใบงานออนไลน์ • กรีฑา พ22103 • ชั้นมัธยมศึกษาปีที่ 2</div><h1>วิเคราะห์ทักษะการกระโดดไกล</h1><p>ตอบก่อน บันทึกคำตอบ แล้วจึงเปิดแนวคำตอบภายหลัง</p></header><main><div class="card profile"><input id="name" placeholder="ชื่อ–สกุล"><input id="room" placeholder="ชั้น/ห้อง"><input id="no" placeholder="เลขที่"></div><div id="questions"></div><div class="buttons"><button class="btn save" onclick="saveAll()">💾 บันทึกคำตอบ</button><button id="reveal" class="btn reveal" disabled onclick="showAnswers()">🔍 ฉันทำเสร็จแล้ว — ดูเฉลย</button><a class="btn home" href="athletics-m2.html">← กลับบทเรียน</a></div></main><script>const Q=[['การกระโดดไกลมีเป้าหมายสำคัญอย่างไร?','สร้างระยะทางไปข้างหน้าให้ได้มากที่สุด โดยควบคุมทักษะและความปลอดภัย'],['4 ขั้นพื้นฐานของการกระโดดไกลมีอะไรบ้าง?','Approach, Take-off, Flight และ Landing'],['การยืนกระโดดไกลสองเท้าควรเริ่มจากท่าใด?','ยืนเท้าประมาณกว้างไหล่ ย่อเข่าและเตรียมเหวี่ยงแขน'],['ขณะ Take-off ของการยืนกระโดดไกลสองเท้าควรทำอย่างไร?','เหวี่ยงแขนไปข้างหน้าพร้อมถีบพื้นด้วยเท้าทั้งสองเพื่อสร้างแรงส่ง'],['เทคนิคกระโดดขาเดียวมีจุดสำคัญอะไร?','ใช้ขาข้างเดียวเป็นขาส่งและรักษาสมดุลของร่างกายขณะลอยตัว'],['ในขั้น Flight นักเรียนควรควบคุมอะไร?','ควบคุมลำตัว แขน และขาให้สมดุลเพื่อเตรียมการลง'],['Landing ที่เหมาะสมในบ่อทรายควรทำอย่างไร?','เตรียมเท้าทั้งสองไปด้านหน้า ลงอย่างสมดุลและย่อเข่ารับแรง'],['เพราะเหตุใดไม่ควรเสียสมดุลถอยหลังหลังลงทราย?','เพราะอาจทำให้จุดสัมผัสด้านหลังใกล้จุดกระโดดมากขึ้นและเสียระยะ'],['ก่อนฝึกกระโดดไกลต้องตรวจสอบอะไรบ้าง?','ตรวจพื้นที่วิ่ง จุดกระโดด บ่อทราย สิ่งแปลกปลอม และรอให้พื้นที่ลงว่าง'],['นักเรียนจะใช้ Feedback เพื่อพัฒนาการกระโดดไกลได้อย่างไร?','นำข้อเสนอแนะมาปรับจังหวะ การส่งตัว การลอยตัว และการลง แล้วฝึกซ้ำอย่างมีเป้าหมาย']];const wrap=document.getElementById('questions');Q.forEach((x,i)=>wrap.insertAdjacentHTML('beforeend',`<div class="card q"><b>${i+1}. ${x[0]}</b><textarea id="a${i+1}" placeholder="พิมพ์คำตอบของนักเรียน..."></textarea><div class="answer"><b>แนวคำตอบ:</b> ${x[1]}</div></div>`));const ids=['name','room','no',...Q.map((_,i)=>'a'+(i+1))];function saveAll(){ids.forEach(id=>localStorage.setItem('ljws_'+id,document.getElementById(id).value));localStorage.setItem('ljws_saved','1');document.getElementById('reveal').disabled=false;alert('บันทึกคำตอบแล้ว สามารถเปิดเฉลยเพื่อเปรียบเทียบได้');}function showAnswers(){document.querySelectorAll('.answer').forEach(x=>x.style.display='block');localStorage.setItem('ljws_revealed','1');}window.onload=()=>{ids.forEach(id=>{const v=localStorage.getItem('ljws_'+id);if(v!==null)document.getElementById(id).value=v});if(localStorage.getItem('ljws_saved'))document.getElementById('reveal').disabled=false;if(localStorage.getItem('ljws_revealed'))showAnswers();};</script></body></html>
