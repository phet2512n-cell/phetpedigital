let current='กระโดดสูง';const tabs=document.getElementById('tabs'),quiz=document.getElementById('quiz');Object.keys(sets).forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>{current=k;render()};tabs.appendChild(b)});function render(){document.getElementById('result').textContent='';quiz.innerHTML='<h2>'+current+' — 10 ข้อ</h2>';sets[current].forEach((q,i)=>{let opts=q[1].map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${'กขคง'[j]}. ${o}</label>`).join('');quiz.insertAdjacentHTML('beforeend',`<div class="card" id="c${i}"><b>${i+1}. ${q[0]}</b>${opts}<div class="feedback" id="f${i}"></div></div>`)});window.scrollTo({top:0,behavior:'smooth'})}function checkAll(){let score=0,missing=[];sets[current].forEach((q,i)=>{let x=document.querySelector(`input[name=q${i}]:checked`),f=document.getElementById('f'+i),c=document.getElementById('c'+i);f.style.display='block';c.classList.remove('ok','bad');if(!x){missing.push(i+1);f.textContent='⚠️ ยังไม่ได้ตอบข้อนี้';return}let ok=+x.value===q[2];if(ok)score++;c.classList.add(ok?'ok':'bad');f.innerHTML=(ok?'✅ ถูกต้อง':'❌ ยังไม่ถูก — คำตอบที่ถูกคือ '+('กขคง'[q[2]])+'. '+q[1][q[2]])+'<br>💡 '+q[3]});document.getElementById('result').textContent=missing.length?'กรุณาตอบให้ครบ: ข้อ '+missing.join(', '):`คะแนน ${score}/10 • ${score>=8?'ผ่านเกณฑ์ 80%':'ควรทบทวนแล้วลองใหม่'}`;document.getElementById('result').scrollIntoView({behavior:'smooth'})}function resetQuiz(){render()}render();
