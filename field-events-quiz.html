['จุดมุ่งหมายของการทุ่มน้ำหนักคือข้อใด',['ทุ่มให้ได้ระยะไกลตามกติกา','โยนสูงที่สุด','กลิ้งพื้น','เตะให้ไกล'],0,'เป้าหมายคือระยะทางภายใต้กติกา'],['ลักษณะการส่งลูกที่ถูกต้องคือข้อใด',['ขว้างเหมือนลูกบอล','ผลักหรือดันลูกจากบริเวณคอ/ไหล่','โยนสองมือเหนือศีรษะ','กลิ้งจากมือ'],1,'ทุ่มน้ำหนักใช้การผลักหรือดัน'],['ก่อนทุ่มควรวางลูกบริเวณใด',['ใกล้คอหรือไหล่','หน้าท้อง','หลังศีรษะ','เข่า'],0,'ลูกอยู่ชิดบริเวณคอ/ไหล่'],['ควรใช้แรงจากส่วนใด',['แขนอย่างเดียว','ขา สะโพก ลำตัว และแขน','ข้อมืออย่างเดียว','คออย่างเดียว'],1,'ถ่ายทอดแรงจากขาและลำตัวสู่แขน'],['แรงจากขามีประโยชน์อย่างไร',['สร้างแรงส่งต่อไปยังลำตัวและแขน','ทำให้ลูกหนักขึ้น','ทำให้หยุด','ไม่มีผล'],0,'ขาเป็นฐานการสร้างแรง'],['ขณะปล่อยลูกควรทำอย่างไร',['ผลักออกต่อเนื่องตามทิศทางเหมาะสม','ปล่อยตกพื้น','โยนด้านหลัง','ใช้สองมือ'],0,'เป็นการผลักต่อเนื่อง'],['หลังปล่อยลูกควรทำอะไร',['ควบคุมและรักษาสมดุล','วิ่งตามลูก','ล้มหน้า','หันหลังทันที'],0,'ควรรักษาสมดุล'],['การทุ่มน้ำหนักทำในบริเวณใด',['วงกลมทุ่ม','บ่อทราย','ลู่วิ่ง','สนามฟุตบอล'],0,'ปฏิบัติภายในวงกลมทุ่ม'],['ก่อนเก็บลูกน้ำหนักควรทำอย่างไร',['รอสัญญาณและให้พื้นที่ปลอดภัย','รีบวิ่งไปทันที','ให้เพื่อนโยนกลับ','ยืนในพื้นที่ตก'],0,'รอสัญญาณก่อนเข้าไปเก็บ'],['หลักสำคัญในการพัฒนาทักษะคือข้อใด',['ฝึกประสานแรงและท่าทางให้ถูกต้อง','ใช้แขนอย่างเดียว','เพิ่มน้ำหนักมากที่สุด','ไม่ต้องอบอุ่น'],0,'ฝึกท่าทางและการประสานแรงอย่างถูกต้อง']]

let current='กระโดดสูง';const tabs=document.getElementById('tabs'),quiz=document.getElementById('quiz');Object.keys(sets).forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>{current=k;render()};tabs.appendChild(b)});
function render(){document.getElementById('result').textContent='';document.getElementById('save').style.display='none';quiz.innerHTML='<h2>'+current+' — 10 ข้อ</h2>';sets[current].forEach((q,i)=>{let opts=q[1].map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${'กขคง'[j]}. ${o}</label>`).join('');quiz.insertAdjacentHTML('beforeend',`<div class="card" id="c${i}"><b>${i+1}. ${q[0]}</b>${opts}<div class="feedback" id="f${i}"></div></div>`)});}
async function checkAll(){let name=document.getElementById('name').value.trim(),classno=document.getElementById('classno').value.trim();if(!name||!classno){alert('กรุณากรอกชื่อ-สกุล และชั้น/เลขที่ก่อนทำแบบทดสอบ');return}let score=0,missing=[],answers=[];sets[current].forEach((q,i)=>{let x=document.querySelector(`input[name=q${i}]:checked`),f=document.getElementById('f'+i),c=document.getElementById('c'+i);f.style.display='block';c.classList.remove('ok','bad');if(!x){missing.push(i+1);f.textContent='⚠️ ยังไม่ได้ตอบข้อนี้';return}let v=+x.value,ok=v===q[2];answers.push(`${i+1}:${'กขคง'[v]}`);if(ok)score++;c.classList.add(ok?'ok':'bad');f.innerHTML=(ok?'✅ ถูกต้อง':'❌ ยังไม่ถูก — คำตอบที่ถูกคือ '+('กขคง'[q[2]])+'. '+q[1][q[2]])+'<br>💡 '+q[3]});if(missing.length){document.getElementById('result').textContent='กรุณาตอบให้ครบ: ข้อ '+missing.join(', ');return}document.getElementById('result').textContent=`คะแนน ${score}/10 • ${score>=8?'ผ่านเกณฑ์ 80%':'ควรกลับไปทบทวนแล้วลองใหม่'}`;let s=document.getElementById('save');s.style.display='block';s.textContent='กำลังบันทึกผลลง Google Sheet...';try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({stage:'แบบทดสอบ',name,classno,question:`[${current}] คะแนนแบบทดสอบ 10 ข้อ`,answer:`${score}/10 | ${score>=8?'ผ่าน':'ควรทบทวน'} | คำตอบ ${answers.join(', ')}`})});s.textContent='✅ ส่งผลการทำแบบทดสอบไปยัง Google Sheet แล้ว';}catch(e){s.textContent='⚠️ ส่งข้อมูลไม่สำเร็จ กรุณาลองอีกครั้ง';}}
function resetQuiz(){render()}render();
</script></body></html>
