async function checkAll(){let room=document.getElementById('room').value,number=document.getElementById('number').value;if(!room||!number){alert('กรุณาเลือกห้องและเลขที่ก่อนทำแบบทดสอบ');return}let normalizedNumber=String(Number(number));let classno=room+' เลขที่ '+normalizedNumber;let student_id='M2-'+room.split('/')[1]+'-'+normalizedNumber;let score=0,missing=[],answers=[];sets[current].forEach((q,i)=>{let x=document.querySelector(`input[name=q${i}]:checked`),f=document.getElementById('f'+i),c=document.getElementById('c'+i);f.style.display='block';c.classList.remove('ok','bad');if(!x){missing.push(i+1);f.textContent='⚠️ ยังไม่ได้ตอบข้อนี้';return}let v=+x.value,ok=v===q[2];answers.push(`${i+1}:${'กขคง'[v]}`);if(ok)score++;c.classList.add(ok?'ok':'bad');f.innerHTML=(ok?'✅ ถูกต้อง':'❌ ยังไม่ถูก — คำตอบที่ถูกคือ '+('กขคง'[q[2]])+'. '+q[1][q[2]])+'<br>💡 '+q[3]});if(missing.length){document.getElementById('result').textContent='กรุณาตอบให้ครบ: ข้อ '+missing.join(', ');return}document.getElementById('result').textContent=`คะแนน ${score}/10 • ${score>=8?'ผ่านเกณฑ์ 80%':'ควรกลับไปทบทวนแล้วลองใหม่'}`;let s=document.getElementById('save');s.style.display='block';s.textContent='กำลังบันทึกผลลง Google Sheet...';try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({student_id,room,number:normalizedNumber,period:'after',topic:current,score,full_score:10,source:'เว็บไซต์ PE Digital Learning Center'})});s.textContent='✅ ส่งผลการทำแบบทดสอบไปยัง Google Sheet แล้ว';}catch(e){s.textContent='⚠️ ส่งข้อมูลไม่สำเร็จ กรุณาลองอีกครั้ง';}}
function resetQuiz(){render()}render();
