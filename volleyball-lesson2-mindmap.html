<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Map เรื่องที่ 2 การเซตบอล</title><style>body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef7ff;color:#102a43;line-height:1.7}.wrap{max-width:1000px;margin:auto;padding:28px 16px}.card{background:#fff;border-radius:20px;padding:25px;margin-bottom:18px;box-shadow:0 8px 24px #0b3b6618}.student,.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}.grid{grid-template-columns:1fr 1fr;margin-top:18px}label{font-weight:bold;color:#0757a6}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:2px solid #d8e7f5;border-radius:12px;font-size:16px;margin-top:6px}textarea{min-height:90px}.title{display:inline-block;background:#0757a6;color:#fff;padding:6px 14px;border-radius:999px;font-weight:bold}button{border:0;border-radius:14px;padding:14px 25px;background:#0757a6;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}.actions{text-align:center;margin:25px}.result{display:none;background:#ecfff4}@media(max-width:650px){.student,.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="card"><h1>🧠 Mind Map เรื่องที่ 2</h1><h2>ทักษะการเซตบอลที่ฉันเข้าใจแล้ว</h2><div class="student"><div><label>ชื่อ-นามสกุล</label><input id="name"></div><div><label>ชั้น</label><select id="class"><option value="">เลือกห้อง</option><option>ม.3/1</option><option>ม.3/2</option><option>ม.3/3</option><option>ม.3/4</option><option>ม.3/5</option><option>ม.3/6</option></select></div><div><label>เลขที่</label><select id="no"><option value="">เลือกเลขที่</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option><option>32</option><option>33</option><option>34</option><option>35</option><option>36</option><option>37</option><option>38</option><option>39</option><option>40</option><option>41</option><option>42</option><option>43</option><option>44</option><option>45</option><option>46</option><option>47</option><option>48</option><option>49</option><option>50</option></select></div></div></section><section class="card"><span class="title">เชื่อมโยง 9 ประเด็น</span><p>เขียนคำสำคัญหรือสรุปสั้น ๆ ในแต่ละช่อง</p><div class="grid"><div><label>1. ความสำคัญของการเซต</label><textarea id="m1" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>2. ท่าเตรียม</label><textarea id="m2" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>3. การเคลื่อนที่เข้าหาบอล</label><textarea id="m3" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>4. การวางมือและนิ้ว</label><textarea id="m4" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>5. การสัมผัสบอล</label><textarea id="m5" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>6. การควบคุมแรง</label><textarea id="m6" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>7. การควบคุมทิศทาง</label><textarea id="m7" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>8. การเซตให้เพื่อน</label><textarea id="m8" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>9. การนำไปใช้ในการเล่นจริง</label><textarea id="m9" placeholder="เขียนความเข้าใจ"></textarea></div></div></section><div class="actions"><button onclick="send()">📤 ส่ง Mind Map ให้ครู</button></div><section id="result" class="card result"><h2>✅ ส่ง Mind Map เรียบร้อยแล้ว</h2><p id="msg"></p><a href="volleyball.html">← กลับหน้ารายวิชา</a></section></div><script>const URL='https://script.google.com/macros/s/AKfycbyF8YC2k1-WEvmELvNKgzCHkEpoQrYhR8BSUUPozcsiNANAFaxHaUn4e5LUGvr8_zocMQ/exec';async function send(){const name=document.getElementById('name').value.trim(),cls=document.getElementById('class').value,no=document.getElementById('no').value;if(!name||!cls||!no){alert('กรุณากรอกข้อมูลนักเรียนให้ครบครับ');return}for(let i=1;i<=9;i++)if(!document.getElementById('m'+i).value.trim()){alert('กรุณาทำ Mind Map ให้ครบ 9 ประเด็นครับ');return}const p={name,class:cls,no,work:'Mind Map เรื่องที่ 2 การเซตบอล',attempt:1,submissionType:'mindmap',quizType:'Mind Map เรื่องที่ 2'};for(let i=1;i<=9;i++)p['Mind Map'+i]=document.getElementById('m'+i).value.trim();await fetch(URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});document.getElementById('result').style.display='block';document.getElementById('msg').textContent='คุณ '+name+' ห้อง '+cls+' เลขที่ '+no+' ส่ง Mind Map เรื่องที่ 2 แล้ว';document.querySelectorAll('input,select,textarea,button').forEach(x=>x.disabled=true);document.getElementById('result').scrollIntoView({behavior:'smooth'})}</script></body></html>
