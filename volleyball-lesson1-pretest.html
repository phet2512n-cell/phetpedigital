<style>
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f8fd;color:#092653}header{background:linear-gradient(135deg,#092653,#0066b3,#18aee8);color:#fff;text-align:center;padding:30px 18px}header h1{margin:8px 0}.wrap{max-width:900px;margin:auto;padding:25px 18px 50px}.card{background:#fff;border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 8px 22px #17315a14}.q{padding:18px 0;border-bottom:1px solid #e5edf5}.q:last-child{border:0}.q p{font-weight:800;line-height:1.6}.opt{display:block;background:#f6faff;border:1px solid #d8e7f5;padding:10px 12px;border-radius:10px;margin:8px 0;cursor:pointer}.opt:hover{background:#eaf6ff}button{border:0;background:#0066b3;color:#fff;padding:14px 22px;border-radius:12px;font-size:17px;font-weight:800;cursor:pointer}.result{display:none;background:#eaf8ef;border-left:6px solid #25a65a;padding:18px;border-radius:12px;margin-top:20px}.info-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.info-grid label{font-weight:800}.info-grid input,.info-grid select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cddfec;border-radius:10px;margin-top:6px;font-size:16px}.back{display:inline-block;margin-top:18px;color:#0066b3;font-weight:800}

<header><div style="font-size:48px">📝</div><h1>แบบทดสอบก่อนเรียน</h1><p>แผนที่ 1 ประวัติและความเป็นมา ประโยชน์และความสำคัญของกีฬาวอลเลย์บอล</p><p>ชั้นมัธยมศึกษาปีที่ 3 | จำนวน 10 ข้อ</p></header>

<div class="card"><h3 style="margin-top:0">ข้อมูลนักเรียน</h3><div class="info-grid"><label>ชื่อ–สกุล<input id="studentName" required placeholder="กรอกชื่อและนามสกุล"></label><label>ห้อง<select id="studentClass" required><option value="">เลือกห้อง</option><option>ม.3/1</option><option>ม.3/2</option><option>ม.3/3</option><option>ม.3/4</option><option>ม.3/5</option><option>ม.3/6</option></select></label><label>เลขที่<select id="studentNo" required><option value="">เลือกเลขที่</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option><option>32</option><option>33</option><option>34</option><option>35</option><option>36</option><option>37</option><option>38</option><option>39</option><option>40</option><option>41</option><option>42</option><option>43</option><option>44</option><option>45</option><option>46</option><option>47</option><option>48</option><option>49</option><option>50</option></select></label></div><div id="statusNotice" role="status" aria-live="polite" style="display:none;margin-top:14px;padding:14px;border-radius:10px;background:#eef5ff;color:#092653;font-weight:700"></div></div>
<form id="quiz"><div id="qs"></div><button id="submitBtn" type="submit">ส่งแบบทดสอบก่อนเรียน</button><div class="result" id="result"></div></form>

<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbyVpEdhavIE0Q8ccAWax7pF8ql6JAZ7IOBVBPplAW18x5QfpZZ8lZTy3CLCP6T0yt5b0g/exec";
const data=[["กีฬาวอลเลย์บอลเริ่มต้นขึ้นในปีใด และเกิดขึ้นที่ใด","ค.ศ. 1905 ที่ประเทศอังกฤษ","ค.ศ. 1915 ที่ประเทศญี่ปุ่น","ค.ศ. 1895 ที่เมืองโฮลีโอก รัฐแมสซาชูเซตส์ สหรัฐอเมริกา","ค.ศ. 1925 ที่ประเทศบราซิล"],["ผู้คิดค้นกีฬาวอลเลย์บอลคือใคร","William G. Morgan","James Naismith","Thomas Edison","Pierre de Coubertin"],["เหตุผลสำคัญที่ Morgan คิดค้นกีฬานี้ในระยะแรกคืออะไร","ต้องการกีฬาที่เล่นในน้ำ","ต้องการกีฬาที่ใช้ผู้เล่นเพียงคนเดียว","ต้องการกีฬาที่ไม่มีตาข่าย","ต้องการกิจกรรมสำหรับผู้ใหญ่ที่ออกกำลังกายได้โดยไม่หนักหรือปะทะมากเกินไป"],["ชื่อเดิมของกีฬาวอลเลย์บอลคืออะไร และต่อมามีการเสนอชื่อใหม่อย่างไร","Handball และต่อมาเป็น Football","Mintonette และในปี ค.ศ. 1896 เสนอชื่อ Volley Ball","Basket Ball และต่อมาเป็น Net Ball","Net Ball และต่อมาเป็น Mintonette"],["ข้อใดเป็นประโยชน์ด้านร่างกายของกีฬาวอลเลย์บอล","ทำให้ไม่ต้องออกกำลังกาย","ทำให้ร่างกายไม่ต้องเคลื่อนไหว","ช่วยให้ร่างกายได้เคลื่อนไหวและส่งเสริมสุขภาพและสมรรถภาพทางกาย","ช่วยให้พักผ่อนได้ตลอดเวลา"],["การเล่นวอลเลย์บอลช่วยพัฒนาการประสานงานของร่างกายอย่างไร","ฝึกให้ใช้สายตาโดยไม่ต้องเคลื่อนไหว","ฝึกการทำงานสัมพันธ์กันของสายตา มือ และการเคลื่อนไหว","ฝึกเฉพาะการวิ่งโดยไม่ใช้มือ","ไม่เกี่ยวข้องกับการประสานงานของร่างกาย"],["การเล่นวอลเลย์บอลเกี่ยวข้องกับการคิดและการตัดสินใจอย่างไร","เล่นตามใจโดยไม่สังเกตสถานการณ์","ไม่จำเป็นต้องตัดสินใจ","ทำทุกอย่างเหมือนเดิมทุกสถานการณ์","สังเกตตำแหน่งของลูก เพื่อน และคู่แข่งขัน แล้วเลือกวิธีเล่นให้เหมาะสม"],["การทำงานเป็นทีมและการสื่อสารมีความสำคัญต่อการเล่นวอลเลย์บอลอย่างไร","ร่วมมือ ช่วยเหลือ และสื่อสารกับเพื่อนเพื่อให้ทีมบรรลุเป้าหมาย","ต่างคนต่างเล่นโดยไม่สื่อสาร","ให้ผู้เล่นคนเดียวรับผิดชอบทั้งหมด","หลีกเลี่ยงการประสานงานกับเพื่อน"],["ข้อใดสะท้อนระเบียบวินัย ความรับผิดชอบ และน้ำใจนักกีฬา","ไม่สนใจกติกาและโต้เถียงคู่แข่งขัน","ปฏิบัติตามกติกา ตรงต่อเวลา รับผิดชอบหน้าที่ และเคารพคู่แข่งขัน","มาสายและให้เพื่อนทำหน้าที่แทน","ไม่ยอมรับผลการแข่งขัน"],["ความรู้และคุณค่าจากกีฬาวอลเลย์บอลสามารถนำไปใช้ในชีวิตประจำวันด้านใด","การหลีกเลี่ยงการทำงานร่วมกับผู้อื่น","การไม่รับผิดชอบต่อหน้าที่","การสื่อสาร การทำงานเป็นทีม การตัดสินใจ ความรับผิดชอบ วินัย และการเคารพกติกา","การไม่ปฏิบัติตามกติกา"]];
const answers=[2,0,3,1,2,1,3,0,1,2];
const qs=document.getElementById("qs");
data.forEach((d,i)=>{let h='<div class="q"><p>'+(i+1)+". "+d[0]+"</p>";for(let j=1;j<5;j++)h+='<label class="opt"><input type="radio" name="q'+i+'" value="'+(j-1)+'" required> '+d[j]+"</label>";h+="</div>";qs.innerHTML+=h});
// Live quiz status endpoint (Apps Script version 20).
function checkQuizStatus(cls,no){
 return new Promise((resolve,reject)=>{
  const callback="quizStatus_"+Date.now()+"_"+Math.random().toString(36).slice(2);
  const script=document.createElement("script");
  let done=false;
  const cleanup=()=>{delete window[callback];script.remove();clearTimeout(timer)};
  const finish=(error,data)=>{if(done)return;done=true;cleanup();error?reject(error):resolve(data)};
  const timer=setTimeout(()=>finish(new Error("หมดเวลาตรวจสอบสถานะ")),12000);
  window[callback]=data=>finish(null,data);
  script.onerror=()=>finish(new Error("เชื่อมต่อระบบตรวจสอบไม่ได้"));
  script.src=WEB_APP_URL+"?action=quizStatus&quizType="+encodeURIComponent("lesson1-pre")+"&class="+encodeURIComponent(cls)+"&no="+encodeURIComponent(no)+"&callback="+encodeURIComponent(callback);
  document.head.appendChild(script);
 });
}
const statusNotice=document.getElementById("statusNotice");
const submitButton=document.getElementById("submitBtn");
let statusRequestId=0;
let verifiedSubmitted=false;
async function updateIdentityStatus(){
 const requestId=++statusRequestId;
 const cls=document.getElementById("studentClass").value;
 const no=document.getElementById("studentNo").value;
 verifiedSubmitted=false;
 submitButton.disabled=false;
 submitButton.textContent="ส่งแบบทดสอบก่อนเรียน";
 if(!cls||!no){statusNotice.style.display="none";return}
 statusNotice.style.display="block";
 statusNotice.textContent="กำลังตรวจสอบประวัติการส่งแบบทดสอบ...";
 try{
  const status=await checkQuizStatus(cls,no);
  if(requestId!==statusRequestId)return;
  if(!status||status.success!==true)throw new Error("ตรวจสอบไม่ได้");
  if(status.submitted){
   verifiedSubmitted=true;
   statusNotice.textContent="นักเรียนเคยส่งแบบทดสอบนี้แล้ว ไม่สามารถส่งซ้ำได้";
   submitButton.disabled=true;
   submitButton.textContent="ส่งแบบทดสอบแล้ว";
  }else{
   statusNotice.textContent="ยังไม่พบการส่งแบบทดสอบนี้ สามารถทำแบบทดสอบได้";
  }
 }catch(err){
  if(requestId!==statusRequestId)return;
  statusNotice.textContent="ยังตรวจสอบประวัติการส่งไม่ได้ ระบบจะตรวจสอบอีกครั้งก่อนบันทึกคำตอบ";
 }
}
document.getElementById("studentClass").addEventListener("change",updateIdentityStatus);
document.getElementById("studentNo").addEventListener("change",updateIdentityStatus);
document.getElementById("quiz").addEventListener("submit",async e=>{
 e.preventDefault();
 const name=document.getElementById("studentName").value.trim(),cls=document.getElementById("studentClass").value,no=document.getElementById("studentNo").value;
 if(!name||!cls||!no){alert("กรุณากรอกข้อมูลนักเรียนให้ครบ");return}
 if(verifiedSubmitted){return}
 const r=document.getElementById("result"),btn=document.getElementById("submitBtn");
 btn.disabled=true;btn.textContent="กำลังตรวจสอบ...";
 r.style.display="block";r.textContent="กำลังตรวจสอบว่ามีการส่งแบบทดสอบแล้วหรือไม่";
 const show=(msg,canRetry)=>{r.textContent=msg;btn.disabled=!canRetry;btn.textContent=canRetry?"ส่งแบบทดสอบก่อนเรียน":"ส่งแบบทดสอบแล้ว";r.scrollIntoView({behavior:"smooth"})};
 try{
  const before=await checkQuizStatus(cls,no);
  if(!before||before.success!==true)throw new Error("ไม่สามารถยืนยันสถานะการส่ง");
  if(before.submitted){show("นักเรียนเคยส่งแบบทดสอบนี้แล้ว ไม่สามารถส่งซ้ำได้",false);return}
  let score=0,payload={name:name,class:cls,no:no,work:"แบบทดสอบก่อนเรียน เรื่องที่ 1",submissionType:"quiz",quizType:"ก่อนเรียน แผนที่ 1"};
  answers.forEach((a,i)=>{const v=Number(document.querySelector('input[name="q'+i+'"]:checked').value);payload["q"+(i+1)]=v;if(v===a)score++});
  btn.textContent="กำลังบันทึกผล...";r.textContent="กำลังส่งข้อมูลและตรวจสอบผลบันทึก";
  await fetch(WEB_APP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  let after=null;
  for(let i=0;i<4;i++){
   await new Promise(resolve=>setTimeout(resolve,1200));
   try{after=await checkQuizStatus(cls,no)}catch(err){continue}
   if(after&&after.success===true&&after.submitted)break;
  }
  if(after&&after.success===true&&after.submitted){
   show("ระบบพบรายการส่งแบบทดสอบใน Google Sheets แล้ว (ไม่สามารถส่งซ้ำได้)",false);
  }else{
   show("ส่งคำขอแล้ว แต่ยังตรวจสอบผลการบันทึกไม่ได้ กรุณาแจ้งครูผู้สอนก่อนลองส่งใหม่",false);
  }
 }catch(err){
  show("ไม่สามารถยืนยันสถานะการส่งได้ กรุณาแจ้งครูผู้สอนเพื่อตรวจสอบใน Google Sheets ก่อนลองส่งอีกครั้ง",true);
 }
});
</script></body></html>
