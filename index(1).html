<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PE Digital Learning Center</title>
  <style>
    body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef5ff;color:#07285a}
    .hero{min-height:100vh;background:linear-gradient(120deg,#061b49,#0b67c2,#f6c343);display:flex;align-items:center;justify-content:center;text-align:center;padding:40px}
    .card{background:rgba(255,255,255,.92);border-radius:28px;padding:45px;max-width:1000px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
    h1{font-size:64px;margin:0;color:#073b82}
    h2{font-size:36px;margin:10px 0 20px}
    p{font-size:24px;line-height:1.6}
    .btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;margin-top:30px}
    a{display:block;text-decoration:none;background:#073b82;color:white;padding:18px;border-radius:16px;font-size:22px;font-weight:bold}
    a:nth-child(2){background:#d32f2f}
    a:nth-child(3){background:#14823b}
    a:nth-child(4){background:#0b67c2}
  </style>
</head>
<body>
  <section class="hero">
    <div class="card">
      <h1>PE Digital Learning Center</h1>
      <h2>ศูนย์การเรียนรู้ดิจิทัลพลศึกษา</h2>
      <p>
        โรงเรียนชะอำคุณหญิงเนื่องบุรี<br>
        โดย ครูประดับเพชร ภูเงิน
      </p>
      <p>“เล่นกีฬา พัฒนากาย ใฝ่เรียนรู้ มุ่งสู่ความเป็นเลิศ”</p>
      <div class="btns">
        <a href="#">แชร์บอล พ21103</a>
        <a href="#">กรีฑา พ22103</a>
        <a href="#">เซปักตะกร้อ พ23103</a>
        <a href="#">แฮนด์บอล พ23203</a>
      </div>
    </div>
  </section>
</body>
</html>
