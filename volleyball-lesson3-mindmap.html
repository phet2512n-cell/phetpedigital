<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Map เรื่องที่ 3 การอันเดอร์</title><style>body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef7ff;color:#102a43;line-height:1.7}.wrap{max-width:1000px;margin:auto;padding:28px 16px}.card{background:#fff;border-radius:20px;padding:25px;margin-bottom:18px;box-shadow:0 8px 24px #0b3b6618}.student,.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}.grid{grid-template-columns:1fr 1fr;margin-top:18px}label{font-weight:bold;color:#0757a6}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:2px solid #d8e7f5;border-radius:12px;font-size:16px;margin-top:6px}textarea{min-height:90px}.title{display:inline-block;background:#0757a6;color:#fff;padding:6px 14px;border-radius:999px;font-weight:bold}button{border:0;border-radius:14px;padding:14px 25px;background:#0757a6;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}.actions{text-align:center;margin:25px}.result{display:none;background:#ecfff4}@media(max-width:650px){.student,.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="card"><h1>🧠 Mind Map เรื่องที่ 3</h1><h2>ทักษะการอันเดอร์ที่ฉันเข้าใจแล้ว</h2><div class="student"><div><label>ชื่อ-นามสกุล</label><input id="name"></div><div><label>ชั้น</label><select id="class"><option value="">เลือกห้อง</option><option>ม.3/1</option><option>ม.3/2</option><option>ม.3/3</option><option>ม.3/4</option><option>ม.3/5</option><option>ม.3/6</option></select></div><div><label>เลขที่</label><select id="no"><option value="">เลือกเลขที่</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option><option>32</option><option>33</option><option>34</option><option>35</option><option>36</option><option>37</option><option>38</option><option>39</option><option>40</option><option>41</option><option>42</option><option>43</option><option>44</option><option>45</option><option>46</option><option>47</option><option>48</option><option>49</option><option>50</option></select></div></div></section><section class="card"><span class="title">เชื่อมโยง 10 ประเด็น</span><p>เขียนคำสำคัญหรือสรุปสั้น ๆ ในแต่ละช่อง</p><div class="grid"><div><label>1. ความหมายและความสำคัญ</label><textarea id="m1" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>2. ท่าเตรียมพร้อม</label><textarea id="m2" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>3. การเคลื่อนที่เข้าหาบอล</label><textarea id="m3" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>4. การประสานมือ</label><textarea id="m4" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>5. การสร้างแขนรับบอล</label><textarea id="m5" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>6. การสัมผัสและส่งแรง</label><textarea id="m6" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>7. การควบคุมทิศทาง</label><textarea id="m7" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>8. รับลูกเสิร์ฟและฝึกเล่นเป็นทีมด้วยการอันเดอร์</label><textarea id="m8" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>9. ข้อผิดพลาดและการแก้ไข</label><textarea id="m9" placeholder="เขียนความเข้าใจ"></textarea></div><div><label>10. สรุป 6 ขั้นตอนจากการฝึกจริง</label><textarea id="m10" placeholder="เขียนความเข้าใจ"></textarea></div></div></section><div class="actions"><button id="sendBtn" onclick="send()">📤 ส่ง Mind Map</button><p id="sendStatus" aria-live="polite"></p><button type="button" onclick="logoutStudent()" style="background:#64748b;font-size:14px;margin-top:12px">ออกจากการทำงาน / ส่งต่อเครื่องให้เพื่อน</button><button type="button" id="retryBtn" onclick="retrySend()" style="display:none;background:#64748b;font-size:14px;margin-top:12px">ไม่พบใน Google Sheets — ส่งคำขออีกครั้ง</button></div><section id="result" class="card result"><h2>📨 ส่งคำขอ Mind Map แล้ว</h2><p id="msg"></p><a href="volleyball.html">← กลับหน้ารายวิชา</a></section></div><script>
const URL='https://script.google.com/macros/s/AKfycbzT0OiZqZWo0pRv6N1V5PArNdOBHb9DcO19qJQDdMQuSV1MIN9yKehObokb4zag41y9/exec';
const SUBMITTED_PREFIX='volleyball_lesson3_mindmap_submitted:';
const IDENTITY_KEY='volleyball_student_identity_v1';
function rememberIdentity(){
 const d={name:document.getElementById('name').value.trim(),cls:document.getElementById('class').value,no:document.getElementById('no').value};
 if(d.name&&d.cls&&d.no&&!localStorage.getItem(IDENTITY_KEY))localStorage.setItem(IDENTITY_KEY,JSON.stringify(d));
 if(localStorage.getItem(IDENTITY_KEY))restoreIdentity();
}
function restoreIdentity(){
 try{const d=JSON.parse(localStorage.getItem(IDENTITY_KEY)||'null');if(!d)return;
 document.getElementById('name').value=d.name||'';document.getElementById('class').value=d.cls||'';document.getElementById('no').value=d.no||'';
 ['name','class','no'].forEach(id=>document.getElementById(id).disabled=true);
 }catch(e){}
}

function logoutStudent(){
 if(!confirm("ต้องการออกจากการทำงานเพื่อส่งต่อเครื่องให้เพื่อนหรือไม่? กรุณาตรวจ Google Sheets ก่อนออก"))return;
 localStorage.removeItem(IDENTITY_KEY);
 localStorage.removeItem("volleyball_lesson2_worksheet_last_student");
 ["name","class","no"].forEach(id=>{const el=document.getElementById(id);el.disabled=false;el.value="";});
 for(let i=1;i<=10;i++)document.getElementById("m"+i).value="";
 document.getElementById("result").style.display="none";
 document.getElementById("sendStatus").textContent="ออกจากการทำงานแล้ว เพื่อนคนถัดไปกรอกข้อมูลได้";
 refreshSendUI();window.scrollTo({top:0,behavior:"smooth"});
}
function studentKey(){
 const name=document.getElementById('name').value.trim().replace(/\s+/g,' ').toLowerCase();
 const cls=document.getElementById('class').value,no=document.getElementById('no').value;
 return name&&cls&&no?SUBMITTED_PREFIX+[name,cls,no].join('|'):'';
}
function refreshSendUI(){
 const key=studentKey(),sent=key&&localStorage.getItem(key)==='1';
 const btn=document.getElementById('sendBtn');
 btn.disabled=!!sent;
 btn.textContent=sent?'ส่งคำขอแล้ว':'📤 ส่ง Mind Map';
 document.getElementById('retryBtn').style.display=sent?'inline-block':'none';
}
function retrySend(){
 const key=studentKey();
 if(!key){alert('กรุณากรอกชื่อ ชั้น และเลขที่ก่อนครับ');return}
 if(!confirm('ตรวจ Google Sheets แล้วว่าไม่มีรายการ Mind Map ของนักเรียนคนนี้จริงใช่หรือไม่?\\nหากมีรายการอยู่แล้ว อย่าส่งซ้ำ'))return;
 localStorage.removeItem(key);
 refreshSendUI();
 send();
}
async function send(){
 const name=document.getElementById('name').value.trim(),cls=document.getElementById('class').value,no=document.getElementById('no').value;
 if(!name||!cls||!no){alert('กรุณากรอกชื่อ ชั้น และเลขที่ให้ครบครับ');return}
 for(let i=1;i<=10;i++)if(!document.getElementById('m'+i).value.trim()){alert('กรุณาทำ Mind Map ให้ครบ 10 ประเด็นครับ');return}
 rememberIdentity();
 const key=studentKey();
 if(localStorage.getItem(key)==='1'){alert('เครื่องนี้บันทึกว่าส่ง Mind Map แล้วครับ');refreshSendUI();return}
 const p={name,class:cls,no,work:'Mind Map เรื่องที่ 3 การอันเดอร์',attempt:1,submissionType:'mindmap',quizType:'Mind Map เรื่องที่ 3'};
 for(let i=1;i<=10;i++){const v=document.getElementById('m'+i).value.trim();p['mm'+i]=v;p['m'+i]=v;p['mindmap'+i]=v;}
 const btn=document.getElementById('sendBtn'),result=document.getElementById('result'),msg=document.getElementById('msg'),status=document.getElementById('sendStatus');
 btn.disabled=true;btn.textContent='กำลังส่งข้อมูล...';
 try{
  await fetch(URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
  localStorage.setItem(key,'1');
  result.style.display='block';
  msg.textContent='เว็บไซต์ส่งคำขอแล้ว แต่ยังยืนยันการบันทึกไม่ได้ กรุณาตรวจ Google Sheets ก่อน หากไม่มีข้อมูล ให้กดปุ่มส่งคำขออีกครั้ง';
  status.textContent='รอตรวจยืนยันใน Google Sheets';
  refreshSendUI();
  result.scrollIntoView({behavior:'smooth'});
 }catch(e){
  btn.disabled=false;btn.textContent='📤 ส่ง Mind Map';
  status.textContent='ส่งคำขอไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่';
 }
}
['name','class','no'].forEach(id=>document.getElementById(id).addEventListener('change',refreshSendUI));
document.getElementById('name').addEventListener('input',refreshSendUI);
restoreIdentity();
refreshSendUI();
</script></body></html>
