<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><linearGradient id="h"><stop stop-color="#073b87"/><stop offset="1" stop-color="#16a9df"/></linearGradient><style>.t{font-family:Tahoma,'Noto Sans Thai',sans-serif;fill:#102e52}.w{fill:white}.title{font-size:48px;font-weight:900}.head{font-size:27px;font-weight:800}.body{font-size:22px;font-weight:600}.num{font-size:30px;font-weight:900;fill:white}</style><g id="ball"><circle r="23" fill="#ffd53d" stroke="#0759a6" stroke-width="4"/><path d="M-20 -8Q0 -27 19 -7M-8 20Q-25 0 -8 -20M9 20Q25 0 9 -20" fill="none" stroke="#0759a6" stroke-width="5"/></g><g id="p"><circle cy="0" r="20" fill="#d99a70" stroke="#102e52" stroke-width="3"/><path d="M-20 -5Q-14 -25 5 -20Q20 -18 19 -2L5 -10L-8 -9Z" fill="#172b45"/><path d="M-22 25Q0 16 22 25L27 75L-27 75Z" fill="#0877cf" stroke="white" stroke-width="3"/><path d="M-14 36L-30 60L-12 80M14 36L30 60L12 80" fill="none" stroke="#d99a70" stroke-width="11" stroke-linecap="round"/><path d="M-17 75L-24 108L-38 128M17 75L24 108L38 128" fill="none" stroke="#152c48" stroke-width="16" stroke-linecap="round"/></g></defs><rect width="1600" height="1100" rx="25" fill="#eaf5ff"/><rect x="18" y="18" width="1564" height="130" rx="25" fill="url(#h)"/><use href="#ball" transform="translate(80 80) scale(1.2)"/><text x="140" y="76" class="t title w">เรื่องที่ 3 การอันเดอร์</text><text x="143" y="118" class="t head w">รับบอลมือเบื้องล่าง • วอลเลย์บอล ม.3 • ครูประดับเพชร ภูเงิน</text>
<rect x="24" y="170" width="755" height="450" rx="22" fill="white" stroke="#b7def5" stroke-width="3"/><text x="48" y="212" class="t head">4 ขั้นตอนการอันเดอร์ที่ถูกต้อง</text>
<g transform="translate(42 235)"><rect width="170" height="250" rx="16" fill="#eaf6ff"/><circle cx="27" cy="27" r="22" fill="#ff8a22"/><text x="19" y="37" class="t num">1</text><text x="58" y="36" class="t head">ท่าพร้อม</text><use href="#p" transform="translate(84 100) scale(.72)"/><text x="12" y="205" class="t body">เท้ากว้าง งอเข่า</text><text x="12" y="235" class="t body">โน้มตัวเล็กน้อย</text></g>
<g transform="translate(225 235)"><rect width="170" height="250" rx="16" fill="#eaf6ff"/><circle cx="27" cy="27" r="22" fill="#ff8a22"/><text x="19" y="37" class="t num">2</text><text x="58" y="36" class="t head">เคลื่อนที่</text><use href="#p" transform="translate(80 100) scale(.72)"/><use href="#ball" transform="translate(137 85) scale(.65)"/><text x="12" y="205" class="t body">ก้าวเข้าหาบอล</text><text x="12" y="235" class="t body">ให้อยู่ด้านหน้า</text></g>
<g transform="translate(408 235)"><rect width="170" height="250" rx="16" fill="#eaf6ff"/><circle cx="27" cy="27" r="22" fill="#ff8a22"/><text x="19" y="37" class="t num">3</text><text x="58" y="36" class="t head">รับบอล</text><use href="#p" transform="translate(80 100) scale(.72)"/><path d="M60 145L80 164L100 145" fill="none" stroke="#ffd53d" stroke-width="8" stroke-linecap="round"/><text x="12" y="205" class="t body">ประสานมือ</text><text x="12" y="235" class="t body">แขนเหยียดชิดกัน</text></g>
<g transform="translate(591 235)"><rect width="170" height="250" rx="16" fill="#eaf6ff"/><circle cx="27" cy="27" r="22" fill="#ff8a22"/><text x="19" y="37" class="t num">4</text><text x="58" y="36" class="t head">ส่งเป้าหมาย</text><use href="#p" transform="translate(72 100) scale(.72)"/><use href="#ball" transform="translate(130 70) scale(.65)"/><text x="10" y="205" class="t body">ใช้ขาช่วยส่งแรง</text><text x="10" y="235" class="t body">คุมแนวแขน</text></g><rect x="42" y="505" width="718" height="90" rx="15" fill="#fff4d8"/><text x="62" y="540" class="t head">จำให้ขึ้นใจ</text><text x="62" y="574" class="t body">บอลอยู่ด้านหน้า • สัมผัสด้วยแขนท่อนล่าง • คุมทิศทางก่อนเพิ่มแรง</text>
<rect x="800" y="170" width="775" height="450" rx="22" fill="white" stroke="#b7def5" stroke-width="3"/><text x="824" y="212" class="t head">จุดสังเกตสำหรับครูและคู่ฝึก</text><g class="t body"><text x="830" y="270">✓  งอเข่า ทรงตัวมั่นคง และมองบอล</text><text x="830" y="325">✓  ประสานมือให้แน่น แขนเหยียดชิดกัน</text><text x="830" y="380">✓  ขยับเท้าให้บอลอยู่ด้านหน้า ไม่เอื้อมสุดแขน</text><text x="830" y="435">✓  สัมผัสบอลบริเวณแขนท่อนล่างเหนือข้อมือ</text><text x="830" y="490">✓  ใช้ขาและลำตัวช่วยส่งแรง ไม่เหวี่ยงแขนแรง</text></g><rect x="822" y="520" width="730" height="75" rx="14" fill="#ffe9e6"/><text x="842" y="550" class="t head" fill="#bd2026">ข้อควรระวัง</text><text x="842" y="580" class="t body">เว้นระยะจากกลุ่มอื่น • โยนบอลเบา ๆ • หยุดเมื่อพื้นที่ไม่ปลอดภัย</text>
<rect x="24" y="642" width="1551" height="330" rx="22" fill="white" stroke="#b7def5" stroke-width="3"/><text x="48" y="686" class="t head">ฝึกปฏิบัติทีละขั้น</text>
<g class="t"><g transform="translate(42 710)"><rect width="240" height="170" rx="15" fill="#eaf6ff"/><text x="14" y="35" class="head">1. ฝึกท่าเปล่า</text><text x="14" y="75" class="body">ประสานมือ เหยียดแขน</text><text x="14" y="110" class="body">ค้างท่า 5–8 วินาที</text><text x="14" y="148" class="body">ทำ 5 รอบ</text></g><g transform="translate(297 710)"><rect width="240" height="170" rx="15" fill="#eaf6ff"/><text x="14" y="35" class="head">2. โยนแล้วรับ</text><text x="14" y="75" class="body">โยนบอลต่ำด้านหน้า</text><text x="14" y="110" class="body">สัมผัสแขนเบา ๆ</text><text x="14" y="148" class="body">ทำ 5–8 ครั้ง</text></g><g transform="translate(552 710)"><rect width="240" height="170" rx="15" fill="#eaf6ff"/><text x="14" y="35" class="head">3. ฝึกกับคู่</text><text x="14" y="75" class="body">คู่ฝึกโยนบอลพอดี</text><text x="14" y="110" class="body">อันเดอร์กลับนุ่มนวล</text><text x="14" y="148" class="body">คนละ 8–10 ครั้ง</text></g><g transform="translate(807 710)"><rect width="240" height="170" rx="15" fill="#eaf6ff"/><text x="14" y="35" class="head">4. โต้ต่อเนื่อง</text><text x="14" y="75" class="body">เริ่มระยะใกล้ก่อน</text><text x="14" y="110" class="body">นับครั้งที่รับส่งได้</text><text x="14" y="148" class="body">ค่อยเพิ่มระยะ</text></g><g transform="translate(1062 710)"><rect width="240" height="170" rx="15" fill="#eaf6ff"/><text x="14" y="35" class="head">5. เคลื่อนที่</text><text x="14" y="75" class="body">ก้าวซ้าย–ขวาเข้าหาบอล</text><text x="14" y="110" class="body">รักษาสมดุลก่อนรับ</text><text x="14" y="148" class="body">ข้างละ 5 ครั้ง</text></g><g transform="translate(1317 710)"><rect width="235" height="170" rx="15" fill="#eaf6ff"/><text x="14" y="35" class="head">6. เล็งเป้าหมาย</text><text x="14" y="75" class="body">ส่งบอลเข้าพื้นที่กำหนด</text><text x="14" y="110" class="body">แม่นยำก่อนเพิ่มแรง</text><text x="14" y="148" class="body">ทำ 5–10 ครั้ง</text></g></g><rect x="42" y="895" width="1510" height="55" rx="14" fill="url(#h)"/><text x="62" y="931" class="t head w">เป้าหมาย: รับบอลถูกจุด • ควบคุมทิศทาง • ส่งต่อให้เพื่อนเล่นได้ต่อเนื่อง</text><text x="800" y="1035" text-anchor="middle" class="t body">รายวิชา พ23104 • โรงเรียนชะอำคุณหญิงเนื่องบุรี • ฝึกอย่างสม่ำเสมอและปลอดภัย</text></svg>