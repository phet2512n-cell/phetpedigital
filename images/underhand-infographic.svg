<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#eaf7ff"/><stop offset="1" stop-color="#fff6e8"/></linearGradient><linearGradient id="hd"><stop stop-color="#073b87"/><stop offset="1" stop-color="#0d9bd7"/></linearGradient><style>.th{font-family:Tahoma,'Noto Sans Thai',sans-serif;fill:#123052}.title{font-size:43px;font-weight:800;fill:white}.sub{font-size:24px;font-weight:700;fill:#ffe27a}.head{font-size:25px;font-weight:800;fill:white}.body{font-size:21px;font-weight:600}.small{font-size:19px;font-weight:700}.num{font-size:30px;font-weight:900;fill:white}</style><g id="ball"><circle r="17" fill="#ffcf31" stroke="#125ba4" stroke-width="3"/><path d="M-15 -7Q0 -20 15 -6M-7 15Q-18 0 -7 -15M8 15Q18 0 8 -15" fill="none" stroke="#125ba4" stroke-width="4"/></g><g id="person"><circle cx="0" cy="0" r="18" fill="#f2bf95" stroke="#123052" stroke-width="3"/><path d="M-17 -5Q-12 -24 4 -18Q18 -16 17 -2L6 -8L-6 -7Z" fill="#24354b"/><path d="M-17 23Q0 15 17 23L23 67L-23 67Z" fill="#fff" stroke="#1765a5" stroke-width="4"/><path d="M-13 31L-27 52L-8 67M13 31L27 52L8 67" fill="none" stroke="#f2bf95" stroke-width="10" stroke-linecap="round"/><path d="M-17 67L-19 93L-31 111M17 67L19 93L31 111" fill="none" stroke="#123052" stroke-width="14" stroke-linecap="round"/><path d="M-38 112H-20M23 112H42" stroke="#f2bf95" stroke-width="9" stroke-linecap="round"/></g></defs>
<rect width="1500" height="980" rx="28" fill="url(#bg)"/><rect x="18" y="18" width="1464" height="120" rx="24" fill="url(#hd)"/><circle cx="80" cy="77" r="39" fill="#ffcf31"/><use href="#ball" transform="translate(80 77) scale(1.3)"/><text x="145" y="70" class="th title">ฝึกทักษะการอันเดอร์ ทีละขั้น</text><text x="148" y="108" class="th sub">วอลเลย์บอล ม.3 • ทำตามลำดับจากง่ายไปยาก</text>
<g transform="translate(24 160)"><rect width="282" height="515" rx="20" fill="white" stroke="#c7e2f6" stroke-width="3"/><rect width="282" height="58" rx="18" fill="#087fc4"/><circle cx="31" cy="29" r="23" fill="#ff9c24"/><text x="23" y="39" class="th num">1</text><text x="64" y="38" class="th head">ท่าเตรียม</text><use href="#person" transform="translate(140 170) scale(1.05)"/><path d="M90 300H190" stroke="#ff9c24" stroke-width="5" stroke-linecap="round"/><text x="18" y="350" class="th body"><tspan x="18" dy="0">• เท้ากว้างช่วงไหล่</tspan><tspan x="18" dy="34">• งอเข่าเล็กน้อย</tspan><tspan x="18" dy="34">• โน้มตัวไปข้างหน้า</tspan><tspan x="18" dy="34">• มองลูกบอลตลอด</tspan></text><rect x="14" y="470" width="254" height="32" rx="10" fill="#e6f5ff"/><text x="28" y="493" class="th small">ฝึกค้างท่า 5–8 วินาที</text></g>
<g transform="translate(323 160)"><rect width="282" height="515" rx="20" fill="white" stroke="#c7e2f6" stroke-width="3"/><rect width="282" height="58" rx="18" fill="#087fc4"/><circle cx="31" cy="29" r="23" fill="#ff9c24"/><text x="23" y="39" class="th num">2</text><text x="64" y="38" class="th head">ประสานมือ</text><g transform="translate(140 175)"><path d="M-62 -45L-15 35Q0 55 15 35L62 -45" fill="#f2bf95" stroke="#123052" stroke-width="7" stroke-linejoin="round"/><path d="M-45 -40L-7 24M45 -40L7 24" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M-70 60H70" stroke="#20a45a" stroke-width="7" stroke-linecap="round"/></g><text x="18" y="300" class="th body"><tspan x="18" dy="0">• มือหนึ่งกำ อีกมือโอบ</tspan><tspan x="18" dy="34">• นิ้วหัวแม่มือวางคู่กัน</tspan><tspan x="18" dy="34">• เหยียดข้อศอกให้ตรง</tspan><tspan x="18" dy="34">• แขนแนบเป็นพื้นเดียว</tspan></text><rect x="14" y="470" width="254" height="32" rx="10" fill="#e6f5ff"/><text x="28" y="493" class="th small">อย่าหักข้อมือ</text></g>
<g transform="translate(622 160)"><rect width="282" height="515" rx="20" fill="white" stroke="#c7e2f6" stroke-width="3"/><rect width="282" height="58" rx="18" fill="#087fc4"/><circle cx="31" cy="29" r="23" fill="#ff9c24"/><text x="23" y="39" class="th num">3</text><text x="64" y="38" class="th head">เข้าหาบอล</text><use href="#person" transform="translate(110 175) scale(.9)"/><use href="#ball" transform="translate(211 198) scale(1.15)"/><path d="M70 285Q120 310 176 276" fill="none" stroke="#e84635" stroke-width="6" stroke-dasharray="10 8"/><path d="M164 270L182 273L174 289" fill="none" stroke="#e84635" stroke-width="6"/><text x="18" y="350" class="th body"><tspan x="18" dy="0">• ก้าวเท้าไปหาบอล</tspan><tspan x="18" dy="34">• จัดตัวให้อยู่หลังบอล</tspan><tspan x="18" dy="34">• ให้บอลอยู่ด้านหน้า</tspan><tspan x="18" dy="34">• อย่าเอื้อมจนเสียหลัก</tspan></text><rect x="14" y="470" width="254" height="32" rx="10" fill="#e6f5ff"/><text x="28" y="493" class="th small">ขยับเท้าก่อนรับบอล</text></g>
<g transform="translate(921 160)"><rect width="282" height="515" rx="20" fill="white" stroke="#c7e2f6" stroke-width="3"/><rect width="282" height="58" rx="18" fill="#087fc4"/><circle cx="31" cy="29" r="23" fill="#ff9c24"/><text x="23" y="39" class="th num">4</text><text x="64" y="38" class="th head">สัมผัสบอล</text><use href="#person" transform="translate(135 175) scale(.9)"/><use href="#ball" transform="translate(150 244) scale(1.05)"/><path d="M96 244L175 244" stroke="#e84635" stroke-width="5" stroke-dasharray="8 6"/><text x="18" y="350" class="th body"><tspan x="18" dy="0">• บอลโดนแขนท่อนล่าง</tspan><tspan x="18" dy="34">• จุดสัมผัสเหนือข้อมือ</tspan><tspan x="18" dy="34">• ใช้ขาและลำตัวส่งแรง</tspan><tspan x="18" dy="34">• ไม่เหวี่ยงแขนแรง ๆ</tspan></text><rect x="14" y="470" width="254" height="32" rx="10" fill="#e6f5ff"/><text x="28" y="493" class="th small">คุมแรงให้พอดี</text></g>
<g transform="translate(1220 160)"><rect width="256" height="515" rx="20" fill="white" stroke="#c7e2f6" stroke-width="3"/><rect width="256" height="58" rx="18" fill="#087fc4"/><circle cx="31" cy="29" r="23" fill="#ff9c24"/><text x="23" y="39" class="th num">5</text><text x="64" y="38" class="th head">ส่งเป้าหมาย</text><use href="#person" transform="translate(65 170) scale(.65)"/><use href="#person" transform="translate(194 170) scale(.65)"/><use href="#ball" transform="translate(133 130)"/><path d="M78 132Q130 75 181 130" fill="none" stroke="#e84635" stroke-width="5" stroke-dasharray="8 7"/><path d="M166 121L183 132L166 139" fill="none" stroke="#e84635" stroke-width="5"/><text x="15" y="300" class="th body"><tspan x="15" dy="0">• หันแนวแขนไปหาเพื่อน</tspan><tspan x="15" dy="34">• คุมความสูงและทิศทาง</tspan><tspan x="15" dy="34">• ส่งบอลให้รับต่อได้</tspan><tspan x="15" dy="34">• เน้นแม่นก่อนแรง</tspan></text><rect x="12" y="470" width="232" height="32" rx="10" fill="#e6f5ff"/><text x="24" y="493" class="th small">ฝึก 5–10 ครั้ง</text></g>
<rect x="24" y="700" width="925" height="245" rx="22" fill="white" stroke="#c7e2f6" stroke-width="3"/><rect x="24" y="700" width="925" height="60" rx="20" fill="#ff9c24"/><text x="48" y="740" class="th" font-size="30" font-weight="900" fill="white">ฝึกกับคู่: โยนเบา ๆ → อันเดอร์กลับ → สลับหน้าที่</text><use href="#person" transform="translate(160 810) scale(.55)"/><use href="#person" transform="translate(330 810) scale(.55)"/><use href="#ball" transform="translate(245 800)"/><path d="M185 805Q240 760 300 805" fill="none" stroke="#e84635" stroke-width="5" stroke-dasharray="8 7"/><text x="400" y="800" class="th body"><tspan x="400" dy="0">1) ยืนห่างกัน 2–3 เมตร</tspan><tspan x="400" dy="35">2) คนหนึ่งโยนบอลระดับเอวถึงอก</tspan><tspan x="400" dy="35">3) อีกคนอันเดอร์กลับ ทำคนละ 8–10 ครั้ง</tspan><tspan x="400" dy="35">4) เมื่อควบคุมได้ ค่อยเพิ่มระยะ</tspan></text>
<rect x="970" y="700" width="506" height="245" rx="22" fill="#fff0ed" stroke="#f05b4d" stroke-width="3"/><rect x="970" y="700" width="506" height="60" rx="20" fill="#d83d34"/><text x="1000" y="740" class="th" font-size="30" font-weight="900" fill="white">ข้อควรระวัง</text><text x="1000" y="805" class="th body"><tspan x="1000" dy="0">• เว้นระยะจากกลุ่มอื่น</tspan><tspan x="1000" dy="37">• โยนบอลเบา ๆ ไม่อัดแรง</tspan><tspan x="1000" dy="37">• ระวังเพื่อนและสิ่งกีดขวาง</tspan><tspan x="1000" dy="37">• หากพื้นที่ไม่ปลอดภัย ให้หยุดฝึก</tspan></text>
</svg>