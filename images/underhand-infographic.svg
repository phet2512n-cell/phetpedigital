<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f6ff"/><stop offset="1" stop-color="#fff5e5"/></linearGradient>
 <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#073b87"/><stop offset="1" stop-color="#087fc4"/></linearGradient>
 <style>
 .th{font-family:Tahoma,'Noto Sans Thai',sans-serif;fill:#102b50}
 .title{font-size:40px;font-weight:800;fill:white}
 .num{font-size:30px;font-weight:800;fill:white}
 .h{font-size:24px;font-weight:800}
 .p{font-size:18px}
 .small{font-size:16px}
 </style>
 <g id="player">
   <circle cx="0" cy="0" r="17" fill="#f1bf94" stroke="#16365d" stroke-width="3"/>
   <path d="M-16 -4 Q-13 -23 3 -18 Q17 -16 17 -3 L8 -9 L-5 -7Z" fill="#25344b"/>
   <path d="M-14 20 Q0 12 14 20 L25 66 L-23 66Z" fill="#fff" stroke="#145da0" stroke-width="4"/>
   <path d="M-13 28 L-28 49 L-5 62 M13 28 L29 48 L7 61" fill="none" stroke="#f1bf94" stroke-width="10" stroke-linecap="round"/>
   <path d="M-18 66 L-16 89 L-31 109 M18 66 L19 89 L35 107" fill="none" stroke="#102b50" stroke-width="14" stroke-linecap="round"/>
   <path d="M-36 110 L-20 110 M28 108 L44 108" stroke="#f1bf94" stroke-width="9" stroke-linecap="round"/>
 </g>
 <g id="ball">
   <circle r="18" fill="#ffce2e" stroke="#145da0" stroke-width="3"/>
   <path d="M-17 -5 Q0 -19 17 -5 M-8 16 Q-18 0 -8 -16 M8 16 Q18 0 8 -16" fill="none" stroke="#145da0" stroke-width="4"/>
 </g>
</defs>
<rect width="1500" height="1120" rx="28" fill="url(#bg)"/>
<rect x="18" y="18" width="1464" height="112" rx="24" fill="url(#head)"/>
<circle cx="76" cy="74" r="37" fill="#ffce2e"/><path d="M45 66 Q75 36 106 62 M61 105 Q43 77 63 42 M88 105 Q110 77 89 42" fill="none" stroke="#145da0" stroke-width="7"/>
<text x="135" y="66" class="th title">ทักษะการเล่นวอลเลย์บอลด้วยมือล่าง</text>
<text x="138" y="105" class="th" font-size="27" font-weight="700" fill="#ffdf42">(การอันเดอร์) • คู่มือภาพ 9 ขั้นตอน</text>
<g transform="translate(30 150)">
 <rect width="465" height="295" rx="22" fill="#fff" stroke="#c5def3" stroke-width="3"/><rect width="465" height="54" rx="22" fill="#087fc4"/><text x="22" y="36" class="th num">1</text><text x="70" y="35" class="th h" fill="white">การเคลื่อนที่และจัดตำแหน่ง</text>
 <g transform="translate(82 100) scale(.72)"><use href="#player"/></g><g transform="translate(238 100) scale(.72)"><use href="#player"/></g><use href="#ball" transform="translate(342 120)"/><path d="M130 172 L185 172" stroke="#ff7b21" stroke-width="7" stroke-linecap="round"/><path d="M177 160 L193 172 L177 184" fill="none" stroke="#ff7b21" stroke-width="7"/>
 <text x="22" y="225" class="th p">• ก้าวสั้นหรือสไลด์เข้าหาบอล</text><text x="22" y="256" class="th p">• ให้บอลอยู่ด้านหน้า กึ่งกลางลำตัว</text><text x="22" y="282" class="th small">• ย่อเข่า รักษาสมดุล พร้อมรับบอล</text>
</g>
<g transform="translate(518 150)">
 <rect width="465" height="295" rx="22" fill="#fff" stroke="#c5def3" stroke-width="3"/><rect width="465" height="54" rx="22" fill="#ed6b19"/><text x="22" y="36" class="th num">2</text><text x="70" y="35" class="th h" fill="white">การประสานมือ</text>
 <g transform="translate(130 104)"><path d="M-56 8 L-15 53 Q0 65 15 53 L56 8" fill="none" stroke="#e9b18b" stroke-width="22" stroke-linecap="round"/><path d="M-40 -2 L-9 35 Q0 43 9 35 L40 -2" fill="none" stroke="#f5c9a3" stroke-width="17" stroke-linecap="round"/><path d="M-28 4 L0 28 L28 4" fill="none" stroke="#fff0d5" stroke-width="8" stroke-linecap="round"/></g>
 <g transform="translate(320 104)"><circle r="50" fill="#edf7ff" stroke="#c5def3" stroke-width="3"/><path d="M-29 -18 L0 8 L29 -18 M-21 4 L-10 25 L0 8 L10 25 L21 4" fill="none" stroke="#145da0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
 <text x="22" y="205" class="th p">• ใช้มือข้างหนึ่งจับอีกข้าง</text><text x="22" y="235" class="th p">• นิ้วหัวแม่มือวางคู่กัน</text><text x="22" y="265" class="th p">• บีบมือให้มั่นคง ไม่เกร็ง</text>
</g>
<g transform="translate(1006 150)">
 <rect width="465" height="295" rx="22" fill="#fff" stroke="#c5def3" stroke-width="3"/><rect width="465" height="54" rx="22" fill="#16815c"/><text x="22" y="36" class="th num">3</text><text x="70" y="35" class="th h" fill="white">การสร้างแขนรับบอล</text>
 <g transform="translate(135 116)"><path d="M-65 -12 L52 40" stroke="#e9b18b" stroke-width="28" stroke-linecap="round"/><path d="M-63 18 L48 54" stroke="#f4c39d" stroke-width="27" stroke-linecap="round"/><path d="M-65 -12 L52 40 M-63 18 L48 54" stroke="#fff0d5" stroke-width="4" stroke-linecap="round"/></g><use href="#ball" transform="translate(325 100)"/>
 <text x="22" y="215" class="th p">• เหยียดแขนตรงและชิดกัน</text><text x="22" y="245" class="th p">• ข้อมือไม่งอ แขนไม่แยก</text><text x="22" y="275" class="th small">• สร้างพื้นรับบอลให้เรียบและมั่นคง</text>
</g>
<g transform="translate(30 468)">
 <rect width="465" height="295" rx="22" fill="#fff" stroke="#c5def3" stroke-width="3"/><rect width="465" height="54" rx="22" fill="#6d45b8"/><text x="22" y="36" class="th num">4</text><text x="70" y="35" class="th h" fill="white">จุดสัมผัสบอล</text>
 <path d="M75 105 Q150 73 223 120" fill="none" stroke="#f1bf94" stroke-width="33" stroke-linecap="round"/><path d="M75 105 Q150 73 223 120" fill="none" stroke="#e75b52" stroke-width="10" stroke-linecap="round"/><use href="#ball" transform="translate(264 99)"/>
 <text x="22" y="200" class="th p">• ใช้แขนท่อนล่างเหนือข้อมือ</text><text x="22" y="232" class="th p">• ประมาณ 1 ฝ่ามือจากข้อมือ</text><text x="22" y="264" class="th p">• ไม่ใช้ฝ่ามือหรือข้อศอกสัมผัส</text>
</g>
<g transform="translate(518 468)">
 <rect width="465" height="295" rx="22" fill="#fff" stroke="#c5def3" stroke-width="3"/><rect width="465" height="54" rx="22" fill="#087fc4"/><text x="22" y="36" class="th num">5</text><text x="70" y="35" class="th h" fill="white">ใช้ขา ลำตัว และแขนส่งแรง</text>
 <g transform="translate(145 104) scale(.65)"><use href="#player"/></g><path d="M100 181 L180 181" stroke="#ff7b21" stroke-width="7"/><path d="M171 169 L187 181 L171 193" fill="none" stroke="#ff7b21" stroke-width="7"/><use href="#ball" transform="translate(282 102)"/>
 <text x="22" y="215" class="th p">• ย่อเข่าก่อนรับบอล</text><text x="22" y="245" class="th p">• เหยียดขาและลำตัวช่วยส่งแรง</text><text x="22" y="275" class="th small">• ไม่เหวี่ยงแขนแรงเพียงอย่างเดียว</text>
</g>
<g transform="translate(1006 468)">
 <rect width="465" height="295" rx="22" fill="#fff" stroke="#c5def3" stroke-width="3"/><rect width="465" height="54" rx="22" fill="#ed6b19"/><text x="22" y="36" class="th num">6</text><text x="70" y="35" class="th h" fill="white">มุมแขนและเป้าหมาย</text>
 <path d="M70 165 L200 112" stroke="#145da0" stroke-width="17" stroke-linecap="round"/><path d="M200 112 L316 76" stroke="#ff7b21" stroke-width="5" stroke-dasharray="10 7"/><use href="#ball" transform="translate(335 68)"/><path d="M204 111 A48 48 0 0 1 244 100" fill="none" stroke="#ed6b19" stroke-width="4"/><text x="218" y="145" class="th small">มุมแขน</text>
 <text x="22" y="215" class="th p">• ปรับแนวแขนไปยังเป้าหมาย</text><text x="22" y="245" class="th p">• หันไหล่และลำตัวไปทิศทางส่ง</text><text x="22" y="275" class="th small">• มองตำแหน่งที่ต้องการให้บอลไป</text>
</g>
<g transform="translate(30 786)">
 <rect width="465" height="295" rx="22" fill="#fff" stroke="#c5def3" stroke-width="3"/><rect width="465" height="54" rx="22" fill="#16815c"/><text x="22" y="36" class="th num">7</text><text x="70" y="35" class="th h" fill="white">ควบคุมแรงตามระยะ</text>
 <use href="#player" transform="translate(95 92) scale(.48)"/><use href="#ball" transform="translate(185 104) scale(.7)"/><path d="M125 120 Q180 75 220 110" fill="none" stroke="#16815c" stroke-width="4" stroke-dasharray="7 6"/><use href="#ball" transform="translate(318 76)"/><path d="M130 143 Q220 25 320 62" fill="none" stroke="#ff7b21" stroke-width="5" stroke-dasharray="9 7"/>
 <text x="22" y="210" class="th p">• เป้าหมายใกล้ ใช้แรงน้อยลง</text><text x="22" y="240" class="th p">• เป้าหมายไกล เพิ่มแรงจากขาและลำตัว</text><text x="22" y="270" class="th small">• ควบคุมทิศทางและความสูงของบอล</text>
</g>
<g transform="translate(518 786)">
 <rect width="465" height="295" rx="22" fill="#fff" stroke="#c5def3" stroke-width="3"/><rect width="465" height="54" rx="22" fill="#087fc4"/><text x="22" y="36" class="th num">8</text><text x="70" y="35" class="th h" fill="white">การรับลูกเสิร์ฟ</text>
 <g transform="translate(95 90) scale(.5)"><use href="#player"/></g><use href="#ball" transform="translate(170 90)"/><path d="M125 120 L190 120" stroke="#ff7b21" stroke-width="5"/><path d="M180 108 L196 120 L180 132" fill="none" stroke="#ff7b21" stroke-width="5"/><g transform="translate(285 90) scale(.5)"><use href="#player"/></g><use href="#ball" transform="translate(360 70)"/>
 <text x="22" y="210" class="th p">• เตรียมพร้อมและอ่านทิศทางบอล</text><text x="22" y="240" class="th p">• เคลื่อนที่ให้บอลอยู่ด้านหน้า</text><text x="22" y="270" class="th small">• ส่งบอลไปยังตำแหน่งที่เพื่อนเล่นต่อได้</text>
</g>
<g transform="translate(1006 786)">
 <rect width="465" height="295" rx="22" fill="#fff" stroke="#c5def3" stroke-width="3"/><rect width="465" height="54" rx="22" fill="#c82d4b"/><text x="22" y="36" class="th num">9</text><text x="70" y="35" class="th h" fill="white">เล่นร่วมกับเพื่อน</text>
 <g transform="translate(105 88) scale(.5)"><use href="#player"/></g><g transform="translate(330 88) scale(.5)"><use href="#player"/></g><use href="#ball" transform="translate(220 85)"/><path d="M135 118 Q220 35 300 118" fill="none" stroke="#ff7b21" stroke-width="5" stroke-dasharray="8 6"/>
 <text x="22" y="210" class="th p">• รับ–ส่งบอลร่วมกันอย่างต่อเนื่อง</text><text x="22" y="240" class="th p">• สื่อสารเรียกบอลและมองเพื่อน</text><text x="22" y="270" class="th small">• ส่งบอลให้เพื่อนเล่นลูกต่อไปได้</text>
</g>
</svg>